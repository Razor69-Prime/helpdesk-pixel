name: PXL VNext 3B4 Unified Search and Tracker Performance
on:
  push:
    branches: [pxl-vnext-3b4]
    paths:
      - '.github/workflows/pxl-vnext-3b4.yml'
permissions:
  contents: write
jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          git apply --check PXL-VNEXT-3B4.patch
          git apply PXL-VNEXT-3B4.patch
      - name: Verify
        run: |
          node --test tests/*.test.js
          node --check public/pxl-vnext-3b-project-mr.js
          node --check public/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('public/index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for b in blocks:
              if not b.strip(): continue
              fd,path=tempfile.mkstemp(suffix='.js'); os.close(fd); Path(path).write_text(b)
              r=subprocess.run(['node','--check',path])
              os.unlink(path)
              if r.returncode: raise SystemExit(r.returncode)
          PY
          git diff --check -- public/index.html public/pxl-vnext-3b-project-mr.js public/sw.js tests
      - name: Commit verified change and clean staging
        run: |
          git config user.name "PixelApps Deployment"
          git config user.email "actions@users.noreply.github.com"
          git rm PXL-VNEXT-3B4.patch .github/workflows/pxl-vnext-3b4.yml
          git add -A
          git commit -m "PXL-VNEXT-3B4 unify MR search and speed Project Tracker"
          git push
