name: PXL VNext 2B Sync
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    if: contains(github.event.head_commit.message, 'PXL-VNEXT-2B sync trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 2B changes safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html'); s=p.read_text()
          if 'id="f-survey-fields"' not in s:
              needle='''        <div class="form-group">\n          <label>Deskripsi Pekerjaan</label>\n          <textarea id="f-desc" placeholder="Jelaskan pekerjaan yang dilakukan..."></textarea>\n        </div>'''
              repl=needle+'''\n        <div id="f-survey-fields" style="display:none;border-top:1px solid var(--border);padding-top:14px;margin-top:4px">\n          <div class="card-title" style="margin-bottom:12px">Data Survey</div>\n          <div class="form-row"><div class="form-group"><label>Lokasi Survey</label><input id="f-survey-location" type="text" placeholder="Lokasi/titik survey"/></div><div class="form-group"><label>PIC Survey</label><input id="f-survey-pic" type="text" placeholder="Nama PIC di lokasi"/></div></div>\n          <div class="form-row"><div class="form-group"><label>No. PIC Survey</label><input id="f-survey-pic-phone" type="tel" placeholder="08xxxxxxxxxx"/></div><div class="form-group"><label>Catatan Kebutuhan</label><textarea id="f-survey-notes" placeholder="Kebutuhan/catatan saat survey..."></textarea></div></div>\n          <div class="form-group"><label>Hasil Survey</label><textarea id="f-survey-result" placeholder="Ringkasan hasil survey..."></textarea></div>\n        </div>'''
              assert needle in s
              s=s.replace(needle,repl,1)
          if 'function toggleSurveyFields()' not in s:
              needle="""async function saveReport(){\n  const wo=document.getElementById('f-wo').value.trim();"""
              repl="""function toggleSurveyFields(){\n  const wo=document.getElementById('f-wo')?.value||'';\n  const project=document.getElementById('f-project')?.value||'';\n  const desc=document.getElementById('f-desc')?.value||'';\n  const isSurvey=/(^|[^a-z0-9])survey([^a-z0-9]|$)/i.test([wo,project,desc].join(' '));\n  const box=document.getElementById('f-survey-fields'); if(box) box.style.display=isSurvey?'block':'none';\n  return isSurvey;\n}\ndocument.addEventListener('input',e=>{if(['f-wo','f-project','f-desc'].includes(e.target?.id))toggleSurveyFields();});\n\nasync function saveReport(){\n  const wo=document.getElementById('f-wo').value.trim();"""
              assert needle in s
              s=s.replace(needle,repl,1)
          if 'survey_location:document.getElementById' not in s:
              needle="""      description:   document.getElementById('f-desc').value.trim()||null,\n      rating:        currentRating,"""
              repl="""      description:   document.getElementById('f-desc').value.trim()||null,\n      ...(toggleSurveyFields()&&{\n        survey_location:document.getElementById('f-survey-location')?.value.trim()||null,\n        survey_pic_name:document.getElementById('f-survey-pic')?.value.trim()||null,\n        survey_pic_phone:document.getElementById('f-survey-pic-phone')?.value.trim()||null,\n        survey_notes:document.getElementById('f-survey-notes')?.value.trim()||null,\n        survey_result:document.getElementById('f-survey-result')?.value.trim()||null\n      }),\n      rating:        currentRating,"""
              assert needle in s
              s=s.replace(needle,repl,1)
          p.write_text(s)

          p=Path('server.js'); s=p.read_text()
          if "workOrderType === 'Survey' ?" not in s:
              needle="""      work_order_type:workOrderType,\n      project_name:   req.body.project_name  || null,"""
              repl="""      work_order_type:workOrderType,\n      ...(workOrderType === 'Survey' ? {\n        survey_location:req.body.survey_location||null,\n        survey_pic_name:req.body.survey_pic_name||null,\n        survey_pic_phone:req.body.survey_pic_phone||null,\n        survey_notes:req.body.survey_notes||null,\n        survey_result:req.body.survey_result||null\n      } : {}),\n      project_name:   req.body.project_name  || null,"""
              assert needle in s
              s=s.replace(needle,repl,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          node --test tests/vnext-2b.test.js tests/vnext-2a.test.js tests/vnext-1b.test.js tests/vnext-sector-expansion.test.js tests/vnext-1c.test.js tests/vnext-1c1.test.js
          node --check server.js
          git diff --check
      - name: Commit synchronized 2B source
        run: |
          git config user.name 'PixelApps Deployment'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html server.js PXL-VNEXT-2B-MIGRATION.sql tests/vnext-2b.test.js
          git diff --cached --quiet || git commit -m 'PXL-VNEXT-2B sync production source'
          git push
