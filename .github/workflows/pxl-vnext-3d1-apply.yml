name: PXL-VNEXT-3D1 verified patch

on:
  push:
    branches:
      - pxl-vnext-3d1-hotfix

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://internal.pixelsolusindo.com/downloads/PXL-VNEXT-3D1-hotfix.patch" -o /tmp/pxl.patch
          test "$(wc -c < /tmp/pxl.patch)" = "42215"
          echo "69931a75a2c25628ad44eb98fe9f85ec7769fb97bca7cf92886f729e2a9f7622  /tmp/pxl.patch" | sha256sum -c -
          git apply --check /tmp/pxl.patch
          git apply /tmp/pxl.patch

      - name: Verify hotfix
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --test tests/*.test.js
          node --check project-vnext-3b.js
          node --check project-vnext-3d.js
          node --check db-core.js
          node --check server.js
          node --check public/pxl-vnext-3b-project-mr.js
          node --check public/pxl-vnext-3d-project-photos.js
          node --check public/pxl-stg-0016-project-report.js
          node --check public/sw.js

      - name: Commit verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pxl-vnext-3d1-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: PXL-VNEXT-3D1 photo modal and manual Project MR"
          git push origin HEAD:pxl-vnext-3d1-hotfix
