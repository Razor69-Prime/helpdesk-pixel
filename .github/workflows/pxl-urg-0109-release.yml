name: PXL-URG-0109 Release Verify

on:
  push:
    branches: [pxl-urg-0109]
    paths:
      - '.github/workflows/pxl-urg-0109-release.yml'

permissions:
  contents: write

jobs:
  verify-and-build-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify payload, test, and build final branch
        shell: bash
        run: |
          set -euo pipefail
          BASE='d980aaaec938c57cec8eb16cc8bb24216597363b'
          PATCH_SHA='5cc99a5d03b736dc23c92f190c32987ffafedb82e0342b16a483fbb2ccfe7e2d'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          base64 -d .pxl-release/pxl-urg-0109.patch.gz.b64 | gzip -d > /tmp/pxl-urg-0109.patch
          echo "$PATCH_SHA  /tmp/pxl-urg-0109.patch" | sha256sum -c -
          git apply --check /tmp/pxl-urg-0109.patch
          git apply /tmp/pxl-urg-0109.patch
          node --test tests/*.test.js
          node --check public/pxl-vnext-2c-survey-so-prefill.js
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('public/sales-order.html','utf8');
          const blocks=[...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          blocks.forEach((src,i)=>{ try{ new Function(src); } catch(e){ throw new Error(`inline script ${i+1}: ${e.message}`); } });
          console.log(`INLINE_JS_PASS blocks=${blocks.length}`);
          NODE
          git diff --check
          rm -f .pxl-release/pxl-urg-0109.patch.gz.b64 .github/workflows/pxl-urg-0109-release.yml
          rmdir .pxl-release 2>/dev/null || true
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'PXL-URG-0109 fix WO cancel and Survey SO prefill'
          git push origin HEAD:pxl-urg-0109
