name: PXL VNext 2A Apply
on:
  push:
    branches: [pxl-vnext-2a-apply]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pxl-vnext-2a-apply
      - name: Apply 2A patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/2a.patch
          git apply --check /tmp/2a.patch
          git apply /tmp/2a.patch
      - name: Verify
        run: |
          node --test tests/vnext-1b.test.js tests/vnext-sector-expansion.test.js tests/vnext-1c.test.js tests/vnext-1c1.test.js tests/vnext-2a.test.js
          node --check server.js
          git diff --check
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/pxl-vnext-2a-apply.yml
          git config user.name 'PixelApps Deployment'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'PXL-VNEXT-2A add work order type foundation'
          git push origin HEAD:pxl-vnext-2a-apply
