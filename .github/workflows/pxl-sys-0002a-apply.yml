name: PXL SYS 0002A Apply
on:
  push:
    branches: [pxl-sys-0002a-apply]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pxl-sys-0002a-apply
          fetch-depth: 0
      - run: git apply --check .pxl-sys-0002a.patch && git apply .pxl-sys-0002a.patch
      - run: node --test tests/pxl-sys-0002-light-monitoring.test.js && node --check public/pxl-urg-0076-system-tools.js && git diff --check
      - run: |
          rm -f .pxl-sys-0002a.patch .github/workflows/pxl-sys-0002a-apply.yml
          git config user.name 'PixelApps Deployment'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html public/pxl-urg-0076-system-tools.js tests/pxl-sys-0002-light-monitoring.test.js
          git commit -m 'PXL-SYS-0002A — Fix mobile monitoring layout'
          git push origin HEAD:pxl-sys-0002a-apply
