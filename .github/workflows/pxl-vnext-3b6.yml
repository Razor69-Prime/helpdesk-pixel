name: PXL VNext 3B6 Superadmin Approval

on:
  push:
    branches: [pxl-vnext-3b6]

permissions:
  contents: write

jobs:
  verify-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download verified patch
        run: |
          curl -fsSL 'https://internal.pixelsolusindo.com/downloads/PXL-VNEXT-3B6-verified.patch' -o /tmp/PXL-VNEXT-3B6.patch
          echo '8941279504e28b07d7bb02ce3d93547c951cc89c5764297a16725ebca99249a8  /tmp/PXL-VNEXT-3B6.patch' | sha256sum -c -
      - name: Apply verified commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am /tmp/PXL-VNEXT-3B6.patch
      - name: Full regression
        run: node --test tests/*.test.js
      - name: Syntax checks
        run: |
          node --check server.js
          node --check pxl-stg-0009a-leave-api.js
          node --check public/pxl-vnext-3b-project-mr.js
          node --check public/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          s=Path('public/index.html').read_text()
          for i,b in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)):
              if not b.strip(): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False); f.write(b); f.close()
              r=subprocess.run(['node','--check',f.name],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); sys.exit(1)
          print('INLINE_JS_PASS')
          PY
          git diff --check origin/main...HEAD
      - name: Remove temporary workflow and push verified source
        run: |
          git rm .github/workflows/pxl-vnext-3b6.yml
          git commit -m 'PXL-VNEXT-3B6 cleanup verification workflow'
          git push origin HEAD:pxl-vnext-3b6
