name: PXL VNext 1C Apply
on:
  push:
    branches: [pxl-vnext-1c-apply]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pxl-vnext-1c-apply
          fetch-depth: 0
      - run: git apply --check .pxl-vnext-1c.patch && git apply .pxl-vnext-1c.patch
      - run: node --test tests/vnext-1b.test.js tests/vnext-sector-expansion.test.js tests/vnext-1c.test.js && node --check server.js && git diff --check
      - run: |
          rm -f .pxl-vnext-1c.patch .github/workflows/pxl-vnext-1c-apply.yml
          git config user.name 'PixelApps Deployment'
          git config user.email 'actions@users.noreply.github.com'
          git add server.js public/sales-order.html public/pxl-prod-0022ab-sales-order-sites.js PXL-VNEXT-1C-MIGRATION.sql tests/vnext-1c.test.js
          git commit -m 'PXL-VNEXT-1C sync CRM classification to sales order'
          git push origin HEAD:pxl-vnext-1c-apply
