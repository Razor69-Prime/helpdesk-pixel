name: PXL VNext 2B Apply
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'PXL-VNEXT-2B stage survey files')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git apply .pxl-vnext-2b-code.patch
      - run: node --test tests/vnext-2b.test.js tests/vnext-2a.test.js
      - run: git diff --check
      - run: |
          git config user.name PixelApps
          git config user.email actions@users.noreply.github.com
          git add public/index.html server.js
          git commit -m "PXL-VNEXT-2B add survey work order form"
          git push
