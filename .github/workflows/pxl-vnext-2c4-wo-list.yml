name: PXL-VNEXT-2C4 WO List Performance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pxl-vnext-2c4-wo-list.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply PXL-VNEXT-2C4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.js'); s=p.read_text()
          a="// ══════════════════════════════════════════\n//  TICKETS\n// ══════════════════════════════════════════\napp.get('/api/tickets', requireAuth, async (req, res) => {"
          b="""// ══════════════════════════════════════════
          //  TICKETS
          // ══════════════════════════════════════════
          // PXL-VNEXT-2C4 — list payload tidak membawa blob tanda tangan.
          // TTD tetap tersedia lewat endpoint tracking/detail saat PDF/BAST dibutuhkan.
          function compactTicketForList(ticket){
            const row={...(ticket||{})};
            delete row.tech_signature;
            delete row.customer_signature;
            return row;
          }
          app.get('/api/tickets', requireAuth, async (req, res) => {"""
          if a not in s: raise SystemExit('server ticket anchor not found')
          s=s.replace(a,b,1)
          a="""      return {
                  ...t,
                  invoices: relations.invoices[id] || [],
                  status_history: relations.status_history[id] || [],
                  job_stages: relations.job_stages[id] || []
                };"""
          b="""      return {
                  ...compactTicketForList(t),
                  invoices: relations.invoices[id] || [],
                  status_history: relations.status_history[id] || [],
                  job_stages: relations.job_stages[id] || []
                };"""
          if a not in s: raise SystemExit('server enriched anchor not found')
          p.write_text(s.replace(a,b,1))

          p=Path('public/index.html'); s=p.read_text()
          pairs={
            'id="t-search" placeholder="Cari WO, project, atau customer..." oninput="renderTickets()"':'id="t-search" placeholder="Cari WO, project, atau customer..." oninput="resetTicketListPage()"',
            'id="t-status" onchange="renderTickets()"':'id="t-status" onchange="resetTicketListPage()"',
            'id="t-work-order-type" onchange="renderTickets()"':'id="t-work-order-type" onchange="resetTicketListPage()"',
            'id="t-from" onchange="renderTickets()"':'id="t-from" onchange="resetTicketListPage()"',
            'id="t-to" onchange="renderTickets()"':'id="t-to" onchange="resetTicketListPage()"',
          }
          for a,b in pairs.items():
            if a not in s: raise SystemExit('ui anchor not found: '+a)
            s=s.replace(a,b,1)
          a="let periodState={t:'all',k:'all'}, pollTimer=null, trackUrl='', selectedFile=null;"
          b="""let periodState={t:'all',k:'all'}, pollTimer=null, trackUrl='', selectedFile=null;
          const TICKET_LIST_PAGE_SIZE=25;
          let ticketListPage=1;
          function resetTicketListPage(){ticketListPage=1;renderTickets();}
          function changeTicketListPage(delta){ticketListPage=Math.max(1,ticketListPage+Number(delta||0));renderTickets();const el=document.getElementById('tab-tickets');if(el)el.scrollIntoView({block:'start',behavior:'smooth'});}"""
          if a not in s: raise SystemExit('period state anchor not found')
          s=s.replace(a,b,1)
          a="if(ctx==='t') renderTickets(); else renderKPI();"
          b="if(ctx==='t'){ticketListPage=1;renderTickets();} else renderKPI();"
          if a not in s: raise SystemExit('setPeriod anchor not found')
          s=s.replace(a,b,1)
          a="""  const data=applyRange(allTickets,'t').filter(t=>
              (!search||(t.wo_number||'').toLowerCase().includes(search)||
                         (t.project_name||'').toLowerCase().includes(search)||
                         (t.customer_name||'').toLowerCase().includes(search))&&
              (!status||t.status===status)&&
              (!workOrderType||t.work_order_type===workOrderType)
            );

            const el=document.getElementById('ticket-list');
            if(!data.length){el.innerHTML=`<div class="empty">📭 Belum ada tiket</div>`;return;}
            const smap="""
          b="""  const filteredData=applyRange(allTickets,'t').filter(t=>
              (!search||(t.wo_number||'').toLowerCase().includes(search)||
                         (t.project_name||'').toLowerCase().includes(search)||
                         (t.customer_name||'').toLowerCase().includes(search))&&
              (!status||t.status===status)&&
              (!workOrderType||t.work_order_type===workOrderType)
            );

            const el=document.getElementById('ticket-list');
            if(!filteredData.length){ticketListPage=1;el.innerHTML=`<div class="empty">📭 Belum ada tiket</div>`;return;}
            const totalPages=Math.max(1,Math.ceil(filteredData.length/TICKET_LIST_PAGE_SIZE));
            if(ticketListPage>totalPages) ticketListPage=totalPages;
            const pageStart=(ticketListPage-1)*TICKET_LIST_PAGE_SIZE;
            const data=filteredData.slice(pageStart,pageStart+TICKET_LIST_PAGE_SIZE);
            const smap="""
          if a not in s: raise SystemExit('render filter anchor not found')
          s=s.replace(a,b,1)
          a="""  }).join('');
            pxlRefreshWoDescriptionToggles(el);
          }"""
          b="""  }).join('');
            const pageEnd=Math.min(pageStart+data.length,filteredData.length);
            el.insertAdjacentHTML('beforeend',`<div class="ticket-pagination" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 2px 4px"><span style="font-size:11px;color:var(--muted)">Menampilkan ${pageStart+1}–${pageEnd} dari ${filteredData.length} WO · Halaman ${ticketListPage}/${totalPages}</span><div style="display:flex;gap:6px"><button type="button" class="btn sm" onclick="changeTicketListPage(-1)" ${ticketListPage<=1?'disabled':''}>← Sebelumnya</button><button type="button" class="btn sm" onclick="changeTicketListPage(1)" ${ticketListPage>=totalPages?'disabled':''}>Berikutnya →</button></div></div>`);
            pxlRefreshWoDescriptionToggles(el);
          }"""
          if a not in s: raise SystemExit('render tail anchor not found')
          p.write_text(s.replace(a,b,1))

          Path('tests/pxl-vnext-2c4-wo-list-performance.test.js').write_text(r'''const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const server=fs.readFileSync('server.js','utf8');
          const index=fs.readFileSync('public/index.html','utf8');
          const renderStart=index.indexOf('function renderTickets(){');
          const renderEnd=index.indexOf('\n}\n\n\n\n/* ══ PXL-REV-0064',renderStart);
          const renderBlock=index.slice(renderStart,renderEnd);
          test('ticket list API strips large signature blobs from normal list payload',()=>{
            assert.match(server,/function compactTicketForList\(/); assert.match(server,/delete row\.tech_signature/); assert.match(server,/delete row\.customer_signature/); assert.match(server,/compactTicketForList\(t\)/);
          });
          test('Daftar Tiket renders at most 25 WO cards per page',()=>{
            assert.match(index,/const TICKET_LIST_PAGE_SIZE=25/); assert.match(index,/let ticketListPage=1/); assert.match(renderBlock,/filteredData/); assert.match(renderBlock,/\.slice\(pageStart,pageStart\+TICKET_LIST_PAGE_SIZE\)/); assert.match(renderBlock,/changeTicketListPage/); assert.match(renderBlock,/Halaman/);
          });
          test('ticket filters reset pagination to page one',()=>{
            assert.match(index,/function resetTicketListPage\(\)/); assert.match(index,/id="t-search"[^>]+oninput="resetTicketListPage\(\)"/); assert.match(index,/id="t-status"[^>]+onchange="resetTicketListPage\(\)"/); assert.match(index,/id="t-work-order-type"[^>]+onchange="resetTicketListPage\(\)"/); assert.match(index,/if\(ctx==='t'\)\{ticketListPage=1;renderTickets\(\);\}/);
          });
          ''')
          PY
      - name: Verify
        run: |
          node --test tests/pxl-vnext-2c2-remarks.test.js tests/pxl-vnext-2c3-native-remarks-button.test.js tests/pxl-vnext-2c4-wo-list-performance.test.js tests/vnext-1b.test.js tests/vnext-1c.test.js tests/vnext-1c1.test.js tests/vnext-2a.test.js tests/vnext-2b.test.js tests/vnext-2b1.test.js tests/vnext-2c.test.js
          node --check server.js
          git diff --check
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html server.js tests/pxl-vnext-2c4-wo-list-performance.test.js
          git rm .github/workflows/pxl-vnext-2c4-wo-list.yml
          git commit -m 'PXL-VNEXT-2C4 optimize WO list performance'
          git push origin main
