name: PXL VNext 3B Review Fix
on:
  push:
    branches: [pxl-vnext-3b]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pxl-vnext-3b
          fetch-depth: 0
      - name: Apply review fixes
        run: |
          git apply --check .pxl-vnext-3b-review-fix.patch
          git apply .pxl-vnext-3b-review-fix.patch
      - name: Verify Phase 3B
        run: |
          node --test tests/*.test.js
          node --check server.js
          node --check db-core.js
          node --check project-vnext-3b.js
          node --check public/pxl-vnext-3b-project-mr.js
          node --check public/pxl-vnext-3a-project-detail.js
          node --check public/pxl-stg-0016-project-report.js
          git diff --check
      - name: Commit review fixes
        run: |
          rm -f .pxl-vnext-3b-review-fix.patch .github/workflows/pxl-vnext-3b-review-fix.yml
          git config user.name 'PixelApps Deployment'
          git config user.email 'actions@users.noreply.github.com'
          git add PXL-VNEXT-3B-MIGRATION.sql server.js tests/vnext-3b-project-mr-api.test.js tests/vnext-3b-project-mr-core.test.js
          git commit -m 'PXL-VNEXT-3B fix review findings'
          git push origin HEAD:pxl-vnext-3b
