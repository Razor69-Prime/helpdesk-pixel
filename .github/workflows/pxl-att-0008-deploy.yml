name: PXL-ATT-0008 Deploy

on:
  push:
    branches:
      - pxl-att-0008-deploy

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply HR attendance admin access
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://internal.pixelsolusindo.com/downloads/att-0008.patch.gz' -o /tmp/att.patch.gz
          echo 'efb85640ec601cc9c1d47a310b61bb732d7d0ff01befb2164e0c17975e75ca42  /tmp/att.patch.gz' | sha256sum -c -
          gzip -dc /tmp/att.patch.gz > /tmp/att.patch
          git fetch origin main
          test "$(git rev-parse origin/main)" = 'dcf15b9d730258ce6a722c790585ccc3f449593c'
          git reset --hard origin/main
          git apply --index --whitespace=error-all /tmp/att.patch
          git diff --cached --check
          npm ci --ignore-scripts --no-audit --no-fund
          node --check public/pxl-attendance-v1.js
          node --check pxl-attendance-api.js
          node --test tests/attendance-v1-api.test.js tests/attendance-v1-ui.test.js tests/attendance-v1-permissions.test.js tests/attendance-v1-wiring.test.js
          node --test tests/*.test.js
          test "$(git write-tree)" = '70f64f3f1f96d9c977d8583d0f17a8037ee9d53c'
          git config user.name 'Razor69-Prime'
          git config user.email 'ekahendrayana1986@gmail.com'
          git commit -m 'PXL-ATT-0008 — HR attendance admin'
          git push origin HEAD:main
