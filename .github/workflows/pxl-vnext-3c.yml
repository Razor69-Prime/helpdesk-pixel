name: PXL VNext 3C Project Material Ledger

on:
  push:
    branches:
      - pxl-vnext-3c

permissions:
  contents: write

jobs:
  verify-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: pxl-vnext-3c
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download verified patch
        run: |
          set -euo pipefail
          curl -fsSL 'https://internal.pixelsolusindo.com/downloads/PXL-VNEXT-3C-5f09c5880e2e.patch' -o /tmp/PXL-VNEXT-3C.patch
          echo '5f09c5880e2e0ed105285ddfec2726ae651b7802deeb88a95218a53e81978fb4  /tmp/PXL-VNEXT-3C.patch' | sha256sum -c -
          test "$(wc -c </tmp/PXL-VNEXT-3C.patch)" = '167125'

      - name: Apply verified patch
        run: |
          set -euo pipefail
          git apply --check /tmp/PXL-VNEXT-3C.patch
          git apply /tmp/PXL-VNEXT-3C.patch
          git diff --check

      - name: Full regression
        run: node --test tests/*.test.js

      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check server.js
          node --check db-core.js
          node --check project-vnext-3b.js
          node --check project-vnext-3c.js
          node --check public/pxl-vnext-3b-project-mr.js
          node --check public/pxl-stg-0016-project-report.js
          node --check public/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          html=Path('public/index.html').read_text()
          for i,s in enumerate(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)):
              if not s.strip(): continue
              p=Path('/tmp')/f'inline-{i}.js'; p.write_text(s)
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              p.unlink(missing_ok=True)
              if r.returncode:
                  print(r.stderr); sys.exit(r.returncode)
          print('INLINE_JS_PASS')
          PY

      - name: Remove temporary workflow and push verified source
        run: |
          set -euo pipefail
          rm -f .github/workflows/pxl-vnext-3c.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PXL-VNEXT-3C project material ledger and Input Today control'
          git push origin HEAD:pxl-vnext-3c
