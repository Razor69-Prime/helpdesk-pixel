name: Apply PXL-URG-0108

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pxl-urg-0108-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify unchanged production baseline
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code fce8a9fb51c24e11472ef79d37948eec040522b8 -- . ':(exclude).github/workflows/pxl-urg-0108-apply.yml'

      - name: Download validated patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://internal.pixelsolusindo.com/downloads/pxl-urg-0108.patch -o /tmp/pxl-urg-0108.patch
          echo '14dd34860de6f1e9975a04c47d6e058422d913c55bf6b5e4acc660fd12271864  /tmp/pxl-urg-0108.patch' | sha256sum -c -
          git apply --check /tmp/pxl-urg-0108.patch
          git apply /tmp/pxl-urg-0108.patch
          rm -f .github/workflows/pxl-urg-0108-apply.yml

      - name: Verify fix
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --check server.js
          node --check pxl-urg-0108-mr-stock-policy.js
          node --test tests/*.test.js
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PXL-URG-0108 handle pending warehouse MR stock'
          git push origin HEAD:main
