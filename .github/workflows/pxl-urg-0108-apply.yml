name: Apply PXL-URG-0108

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pxl-urg-0108-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fce8a9fb51c24e11472ef79d37948eec040522b8"
      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch.b64 <<'EOF_PATCH'
онYWRkLTInLG5hbWU6J1RhbWJhaGFuIEN1a3VwJyxzdG9jazp5LHVuaXQ6J3BjcycsaXNfYWN0aXZlOnRydWV9LAorICAgIHtpZDonc28tMicsbmFtZTonSXRlbSBT TyBDdWt1cCcs 
EOF_PATCH
          base64 -d /tmp/patch.b64 > /tmp/pxl-urg-0108.patch
          git apply --check /tmp/pxl-urg-0108.patch
          git apply /tmp/pxl-urg-0108.patch
          rm -f .github/workflows/pxl-urg-0108-apply.yml
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --check server.js
          node --check pxl-urg-0108-mr-stock-policy.js
          node --test tests/*.test.js
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PXL-URG-0108 handle pending warehouse MR stock"
          git push origin HEAD:main
