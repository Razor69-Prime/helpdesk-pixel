name: PXL ATT 0001 Apply

on:
  push:
    branches:
      - pxl-att-0001-apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified attendance patch
        shell: bash
        run: |
          set -euo pipefail
          gzip -t .pxl-att/patch.gz
          gzip -dc .pxl-att/patch.gz > /tmp/pxl-att-0001.patch
          git apply --check /tmp/pxl-att-0001.patch
          git apply /tmp/pxl-att-0001.patch
          rm -rf .pxl-att .pxl-att-gz
          rm -f .github/workflows/pxl-att-0001-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "PXL-ATT-0001 — Absensi Online V1"
          git push origin HEAD:pxl-att-0001-apply
