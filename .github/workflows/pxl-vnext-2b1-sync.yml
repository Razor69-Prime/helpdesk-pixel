name: PXL VNext 2B1 Sync
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    if: contains(github.event.head_commit.message, 'PXL-VNEXT-2B1 sync trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 2B1 changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html'); s=p.read_text()
          if 'id="f-work-order-type"' not in s:
              needle='''        <div class="form-group">\n          <label>Deskripsi Pekerjaan</label>\n          <textarea id="f-desc" placeholder="Jelaskan pekerjaan yang dilakukan..."></textarea>\n        </div>'''
              repl='''        <div class="form-row">\n          <div class="form-group">\n            <label>Deskripsi Pekerjaan</label>\n            <textarea id="f-desc" placeholder="Jelaskan pekerjaan yang dilakukan..."></textarea>\n          </div>\n          <div class="form-group">\n            <label>Tipe Work Order</label>\n            <select id="f-work-order-type" onchange="updateWorkOrderTypeUI(true)">\n              <option value="auto">Auto (Sistem)</option>\n              <option value="Operasional">Operasional</option>\n              <option value="Survey">Survey</option>\n              <option value="Project">Project</option>\n            </select>\n            <div id="f-work-order-type-hint" style="font-size:11px;color:var(--muted);margin-top:5px">Sistem akan menentukan tipe dari sumber/tagging atau isi WO.</div>\n          </div>\n        </div>'''
              assert needle in s
              s=s.replace(needle,repl,1)
          old='''function toggleSurveyFields(){\n  const wo=document.getElementById('f-wo')?.value||'';\n  const project=document.getElementById('f-project')?.value||'';\n  const desc=document.getElementById('f-desc')?.value||'';\n  const isSurvey=/(^|[^a-z0-9])survey([^a-z0-9]|$)/i.test([wo,project,desc].join(' '));\n  const box=document.getElementById('f-survey-fields'); if(box) box.style.display=isSurvey?'block':'none';\n  return isSurvey;\n}\ndocument.addEventListener('input',e=>{if(['f-wo','f-project','f-desc'].includes(e.target?.id))toggleSurveyFields();});'''
          if 'function canOverrideWorkOrderType()' not in s:
              new='''function canOverrideWorkOrderType(){\n  return ['manager','admin','superadmin'].includes(String(currentUser?.role||'').toLowerCase());\n}\nfunction detectWorkOrderTypeFromForm(){\n  const wo=document.getElementById('f-wo')?.value||'';\n  const project=document.getElementById('f-project')?.value||'';\n  const desc=document.getElementById('f-desc')?.value||'';\n  const text=[wo,project,desc].join(' ');\n  if(/(^|[^a-z0-9])survey([^a-z0-9]|$)/i.test(text)) return 'Survey';\n  if(/(^|[^a-z0-9])(instalasi|maintenance)([^a-z0-9]|$)/i.test(text)) return 'Operasional';\n  return 'auto';\n}\nfunction updateWorkOrderTypeUI(manualChange=false){\n  const select=document.getElementById('f-work-order-type');\n  if(!select) return false;\n  if(!manualChange && select.dataset.manual!=='1') select.value=detectWorkOrderTypeFromForm();\n  if(manualChange && canOverrideWorkOrderType()) select.dataset.manual='1';\n  const selectedType=select.value;\n  const box=document.getElementById('f-survey-fields');\n  if(box) box.style.display=selectedType==='Survey'?'block':'none';\n  const hint=document.getElementById('f-work-order-type-hint');\n  if(hint) hint.textContent=select.disabled?'Tipe ditentukan otomatis oleh sistem.':(select.dataset.manual==='1'?'Tipe dipilih manual.':'Sistem akan menentukan tipe dari sumber/tagging atau isi WO.');\n  return selectedType==='Survey';\n}\nfunction applyWorkOrderTypePreset(type){\n  const select=document.getElementById('f-work-order-type');\n  const normalized=['Operasional','Survey','Project'].includes(type)?type:'auto';\n  if(select){ select.value=normalized; select.dataset.manual=''; }\n  updateWorkOrderTypeUI(false);\n}\nfunction toggleSurveyFields(){ return updateWorkOrderTypeUI(false); }\ndocument.addEventListener('input',e=>{if(['f-wo','f-project','f-desc'].includes(e.target?.id))updateWorkOrderTypeUI(false);});'''
              assert old in s
              s=s.replace(old,new,1)
          if "typeSelect.disabled=!canOverrideWorkOrderType()" not in s:
              needle="""  const canAssign=isAdmin||currentUser.role==='manager'||currentUser.role==='operator';\n  document.getElementById('gps-status-group').style.display =isAdmin?'block':'none';"""
              repl="""  const canAssign=isAdmin||currentUser.role==='manager'||currentUser.role==='operator';\n  const typeSelect=document.getElementById('f-work-order-type');\n  if(typeSelect){ typeSelect.disabled=!canOverrideWorkOrderType(); typeSelect.dataset.manual=''; updateWorkOrderTypeUI(false); }\n  document.getElementById('gps-status-group').style.display =isAdmin?'block':'none';"""
              assert needle in s
              s=s.replace(needle,repl,1)
          if "const selectedWorkOrderType=typeSelect?.value||'auto';" not in s:
              needle="""  const tech2=document.getElementById('f-assign-tech2')?.value.trim()||'';\n  if(canAssign&&!tech1){showAlert('error','Wajib memilih minimal 1 teknisi.');return;}"""
              repl="""  const tech2=document.getElementById('f-assign-tech2')?.value.trim()||'';\n  const typeSelect=document.getElementById('f-work-order-type');\n  const selectedWorkOrderType=typeSelect?.value||'auto';\n  if(canAssign&&!tech1){showAlert('error','Wajib memilih minimal 1 teknisi.');return;}"""
              assert needle in s
              s=s.replace(needle,repl,1)
          if 'work_order_type:selectedWorkOrderType' not in s:
              needle="""      description:   document.getElementById('f-desc').value.trim()||null,\n      ...(toggleSurveyFields()&&{"""
              repl="""      description:   document.getElementById('f-desc').value.trim()||null,\n      ...(canOverrideWorkOrderType()&&selectedWorkOrderType!=='auto'&&{work_order_type:selectedWorkOrderType}),\n      ...(selectedWorkOrderType==='Survey'&&{"""
              assert needle in s
              s=s.replace(needle,repl,1)
          if "wt.dataset.manual=''" not in s:
              needle="""  const s2=document.getElementById('f-assign-tech2'); if(s2) s2.value='';\n  const now=new Date();"""
              repl="""  const s2=document.getElementById('f-assign-tech2'); if(s2) s2.value='';\n  const wt=document.getElementById('f-work-order-type'); if(wt){wt.value='auto';wt.dataset.manual='';}\n  ['f-survey-location','f-survey-pic','f-survey-pic-phone','f-survey-notes','f-survey-result'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});\n  updateWorkOrderTypeUI(false);\n  const now=new Date();"""
              assert needle in s
              s=s.replace(needle,repl,1)
          p.write_text(s)

          p=Path('server.js'); s=p.read_text()
          if 'WORK_ORDER_TYPE_OVERRIDE_ROLES' not in s:
              s=s.replace("const WORK_ORDER_TYPES=['Survey','Project','Operasional','Unclassified'];", "const WORK_ORDER_TYPES=['Survey','Project','Operasional','Unclassified'];\nconst WORK_ORDER_TYPE_OVERRIDE_ROLES=['manager','admin','superadmin'];",1)
          if 'requestedWorkOrderType' not in s:
              needle="""    const crmCustomers = await db.getCrmCustomers();\n    const workOrderType = classifyWorkOrderType(req.body, crmCustomers);"""
              repl="""    const crmCustomers = await db.getCrmCustomers();\n    const requestedWorkOrderType = String(req.body.work_order_type||'').trim();\n    const mayOverrideWorkOrderType = WORK_ORDER_TYPE_OVERRIDE_ROLES.includes(String(role||'').toLowerCase());\n    const workOrderType = mayOverrideWorkOrderType && WORK_ORDER_TYPES.includes(requestedWorkOrderType)\n      ? requestedWorkOrderType\n      : classifyWorkOrderType(req.body, crmCustomers);"""
              assert needle in s
              s=s.replace(needle,repl,1)
          p.write_text(s)
          PY
          cat > tests/vnext-2b1.test.js <<'EOF'
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const root=path.resolve(__dirname,'..');
          const server=fs.readFileSync(path.join(root,'server.js'),'utf8');
          const index=fs.readFileSync(path.join(root,'public/index.html'),'utf8');
          test('Input WO shows work order type selector with auto, operasional, survey and project',()=>{assert.match(index,/id="f-work-order-type"/);assert.match(index,/value="auto"/);assert.match(index,/value="Operasional"/);assert.match(index,/value="Survey"/);assert.match(index,/value="Project"/);});
          test('Survey type selection opens survey fields and preset can trigger it',()=>{assert.match(index,/function updateWorkOrderTypeUI\(/);assert.match(index,/function applyWorkOrderTypePreset\(/);assert.match(index,/selectedType\s*===\s*['"]Survey['"]/);});
          test('only manager admin superadmin may manually override WO type on backend',()=>{assert.match(server,/WORK_ORDER_TYPE_OVERRIDE_ROLES/);assert.match(server,/manager.*admin.*superadmin|admin.*superadmin.*manager|superadmin.*manager.*admin/s);assert.match(server,/requestedWorkOrderType/);assert.match(server,/WORK_ORDER_TYPES\.includes\(requestedWorkOrderType\)/);});
          test('submitted payload carries selected WO type only when manual selection is allowed',()=>{assert.match(index,/work_order_type:selectedWorkOrderType/);assert.match(index,/canOverrideWorkOrderType/);});
          EOF
      - name: Verify
        run: |
          node --test tests/vnext-2b1.test.js tests/vnext-2b.test.js tests/vnext-2a.test.js tests/vnext-1b.test.js tests/vnext-sector-expansion.test.js tests/vnext-1c.test.js tests/vnext-1c1.test.js
          node --check server.js
          git diff --check
      - name: Commit synchronized 2B1 source
        run: |
          git config user.name 'PixelApps Deployment'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html server.js tests/vnext-2b1.test.js
          git diff --cached --quiet || git commit -m 'PXL-VNEXT-2B1 add work order type selector'
          git push
