name: PXL-ATT-0007 Deploy

on:
  push:
    branches:
      - pxl-att-0007-deploy

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply attendance report
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://internal.pixelsolusindo.com/downloads/att-0007.patch.gz' -o /tmp/att.patch.gz
          echo '6c8b3bc3aa7c86ef6c1b25befb79e2954d8cffbe7748ac3b407e7653c6bfdfbd  /tmp/att.patch.gz' | sha256sum -c -
          gzip -dc /tmp/att.patch.gz > /tmp/att.patch
          git fetch origin main
          test "$(git rev-parse origin/main)" = '7464f7a3c53d393e846e812af0b149852bd990d5'
          git reset --hard origin/main
          git apply --index --whitespace=error-all /tmp/att.patch
          git diff --cached --check
          npm ci --ignore-scripts --no-audit --no-fund
          node --check public/pxl-attendance-v1.js
          node --test tests/attendance-v1-ui.test.js tests/attendance-v1-wiring.test.js
          node --test tests/*.test.js
          test "$(git write-tree)" = 'effc4699b3aa2f6f03ce9f9ad075a346a3b5c428'
          git config user.name 'Razor69-Prime'
          git config user.email 'ekahendrayana1986@gmail.com'
          git commit -m 'PXL-ATT-0007 — Attendance report'
          git push origin HEAD:main
