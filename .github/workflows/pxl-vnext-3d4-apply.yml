name: PXL-VNEXT-3D4 verified patch
on:
  push:
    branches: [pxl-vnext-3d4-hotfix]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified patch
        run: |
          curl -fsSL 'https://internal.pixelsolusindo.com/downloads/PXL-VNEXT-3D4.patch' -o /tmp/PXL-VNEXT-3D4.patch
          test "$(wc -c < /tmp/PXL-VNEXT-3D4.patch)" = "36973"
          echo 'be400ebe6e124d3aab31b9bb10c73ede6526f6114b115571ddc20e560859570a  /tmp/PXL-VNEXT-3D4.patch' | sha256sum -c -
      - name: Verify hotfix
        run: |
          git apply --check /tmp/PXL-VNEXT-3D4.patch
          git apply /tmp/PXL-VNEXT-3D4.patch
          node --check public/pxl-vnext-3b-project-mr.js
          node --test tests/*.test.js
          git diff --check
      - name: Commit verified hotfix
        run: |
          rm -f .github/workflows/pxl-vnext-3d4-apply.yml
          git config user.name 'Razor69-Prime'
          git config user.email 'ekahendrayana1986@gmail.com'
          git add -A
          git commit -m 'fix: PXL-VNEXT-3D4 unified Project MR material picker'
          git push origin HEAD:pxl-vnext-3d4-hotfix
