name: PXL VNext 3B2A Permission Save Hotfix

on:
  push:
    branches: [pxl-vnext-3b2a]

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pxl-vnext-3b2a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified patch
        run: |
          printf '\n' >> .github/pxl-vnext-3b2a.patch
          git apply --check .github/pxl-vnext-3b2a.patch
          git apply .github/pxl-vnext-3b2a.patch
      - name: Verify full suite
        run: |
          node --test tests/*.test.js
          node --check server.js
          node --check public/pxl-urg-0018-account-permission-explicit-override.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('public/index.html','utf8');
          let n=0;
          for(const m of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){
            if(!m[1].trim())continue;
            new vm.Script(m[1]);
            n++;
          }
          console.log('INLINE_JS_PASS blocks='+n);
          NODE
          git diff --check
      - name: Commit clean result
        run: |
          git config user.name 'PixelApps Deployment'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/pxl-vnext-3b2a.patch .github/workflows/pxl-vnext-3b2a.yml
          git add -A
          git commit -m 'PXL-VNEXT-3B2A fix technician permission save normalization'
          git push origin HEAD:pxl-vnext-3b2a
