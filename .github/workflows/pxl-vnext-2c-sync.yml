name: PXL-VNEXT-2C Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pxl-vnext-2c-sync.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PXL-VNEXT-2C patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Razor69-Prime"
          git config user.email "ekahendrayana1986@gmail.com"
          sed -i 's/3n2H02/3n2n02/' .pxl-vnext-2c.patch.gz.b64
          sed -i 's/Z5o9dde/Z5o9idde/' .pxl-vnext-2c.patch.gz.b64
          base64 -d .pxl-vnext-2c.patch.gz.b64 > /tmp/pxl-vnext-2c.patch.gz
          gzip -dc /tmp/pxl-vnext-2c.patch.gz > /tmp/pxl-vnext-2c.patch
          git apply --check /tmp/pxl-vnext-2c.patch
          git apply /tmp/pxl-vnext-2c.patch
          git rm -f .pxl-vnext-2c.patch.gz.b64 .github/workflows/pxl-vnext-2c-sync.yml
          git add -A
          git commit -m "PXL-VNEXT-2C manual survey to sales order flow"
          git push origin HEAD:main
