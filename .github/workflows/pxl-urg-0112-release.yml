name: PXL-URG-0112 Release Verify

on:
  push:
    branches:
      - pxl-urg-0112-release
    paths:
      - .github/workflows/pxl-urg-0112-release.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=f0c1b6ef032a804691dbbb4fe7b80a878fea8ff8
          git merge-base --is-ancestor "$BASE" HEAD
          cat .github/pxl-urg-0112/part00 .github/pxl-urg-0112/part01 .github/pxl-urg-0112/part02 .github/pxl-urg-0112/part03 > /tmp/pxl-urg-0112.patch
          echo "990640b33cb4dae06fbb7518d8027ce623963000749646ef785c08fa2a4fcabe  /tmp/pxl-urg-0112.patch" | sha256sum -c -
          git apply --check /tmp/pxl-urg-0112.patch
          git apply /tmp/pxl-urg-0112.patch
          node --test tests/*.test.js
          node --check public/pxl-vnext-3a-project-detail.js
          node --check public/pxl-urg-0032a-remarks-button-fix.js
          git diff --check
          rm -rf .github/pxl-urg-0112
          rm -f .github/workflows/pxl-urg-0112-release.yml
          git add -A
          actual="$(git diff --cached --name-only "$BASE" | sort)"
          expected="$(printf '%s\n' public/index.html public/pxl-urg-0032a-remarks-button-fix.js public/pxl-vnext-3a-project-detail.js pxl-stg-0004f.js tests/pxl-urg-0112-gantt-remarks-ui.test.js tests/vnext-3a-project-ui.test.js | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
      - name: Commit clean candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "PXL-URG-0112 fix Gantt drag close and compact WO remarks"
          git push origin HEAD:pxl-urg-0112-release
