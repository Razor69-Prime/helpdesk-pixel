name: PXL VNext 3B5 BOQ Inventory Decoupling
on:
  push:
    branches: [pxl-vnext-3b5]
    paths:
      - '.github/workflows/pxl-vnext-3b5.yml'
permissions:
  contents: write
jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch verified patch
        run: |
          curl -fsS https://internal.pixelsolusindo.com/downloads/PXL-VNEXT-3B5-99e7a711.patch -o /tmp/PXL-VNEXT-3B5.patch
          echo "99e7a71140a047d3b13d7dec72db3e946551fda39f7a364e91889a869820a356  /tmp/PXL-VNEXT-3B5.patch" | sha256sum -c -
          git apply --check /tmp/PXL-VNEXT-3B5.patch
          git apply /tmp/PXL-VNEXT-3B5.patch
      - name: Verify
        run: |
          node --test tests/*.test.js
          node --check server.js
          node --check public/pxl-vnext-3b-project-mr.js
          node --check public/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('public/index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for b in blocks:
              if not b.strip(): continue
              fd,path=tempfile.mkstemp(suffix='.js'); os.close(fd); Path(path).write_text(b)
              r=subprocess.run(['node','--check',path])
              os.unlink(path)
              if r.returncode: raise SystemExit(r.returncode)
          PY
          git diff --check
          ! grep -Ein '\b(drop table|truncate|delete from public\.material_request_forms|alter table public\.material_request_forms|update public\.material_request_forms)\b' PXL-VNEXT-3B5-MIGRATION.sql
      - name: Commit verified change and clean staging
        run: |
          git config user.name "PixelApps Deployment"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pxl-vnext-3b5.yml
          git add -A
          git commit -m "PXL-VNEXT-3B5 decouple BOQ request from Inventory"
          git push