name: PXL VNext 1B1 Apply
on:
  push:
    branches: [pxl-vnext-1b1-apply]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pxl-vnext-1b1-apply
          fetch-depth: 0
      - run: git apply --check .pxl-vnext-1b1.patch && git apply .pxl-vnext-1b1.patch
      - run: node --test tests/vnext-1b.test.js tests/vnext-sector-expansion.test.js && node --check server.js && git diff --check
      - run: |
          rm -f .pxl-vnext-1b1.patch .github/workflows/pxl-vnext-1b1-apply.yml
          git config user.name 'PixelApps Deployment'
          git config user.email 'actions@users.noreply.github.com'
          git add server.js public/crm.html tests/vnext-sector-expansion.test.js
          git commit -m 'PXL-VNEXT-1B1 expand customer sectors'
          git push origin HEAD:pxl-vnext-1b1-apply
