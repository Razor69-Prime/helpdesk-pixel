name: PXL VNext 1B Apply

on:
  push:
    branches: [pxl-vnext-1b-apply]
    paths:
      - '.github/workflows/pxl-vnext-1b-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pxl-vnext-1b-apply
          fetch-depth: 0
      - name: Repair wrapper artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['server.js','public/crm.html','public/index.html','PXL-VNEXT-1A-MIGRATION.sql']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if s.startswith('[Reading '):
                  head, sep, rest=s.partition('\n\n')
                  if sep:
                      p.write_text(rest, encoding='utf-8')
                      print('repaired', name, head)
          PY
      - name: Apply Phase 1B patch
        shell: bash
        run: |
          git apply --check .pxl-vnext-1b.patch
          git apply .pxl-vnext-1b.patch
      - name: Verify
        shell: bash
        run: |
          node --test tests/vnext-1b.test.js
          node --check server.js
          node -e 'const fs=require("fs"),s=fs.readFileSync("public/crm.html","utf8"),m=s.match(/<script>([\s\S]*?)<\/script>/);new Function(m[1]); console.log("crm inline JS PASS")'
          git diff --check
      - name: Commit result
        shell: bash
        run: |
          rm -f .pxl-vnext-1b.patch .github/workflows/pxl-vnext-1b-apply.yml
          git config user.name 'PixelApps Deployment'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'PXL-VNEXT-1B bulk customer classification'
          git push origin HEAD:pxl-vnext-1b-apply
