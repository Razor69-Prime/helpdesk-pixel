name: PXL-VNEXT-2C2 Remarks Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pxl-vnext-2c2-remarks.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply native remarks fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          old="""    const daysLeft=Math.max(0,Math.ceil((expiry-new Date())/864e5));
              // invoice tampil untuk semua kecuali teknisi
              const showInvoice=!isTech;
          """
          new="""    const daysLeft=Math.max(0,Math.ceil((expiry-new Date())/864e5));
              // PXL-VNEXT-2C2 — Remarks harus dirender native agar tidak hilang saat card WO dirender ulang.
              const technicianRemarks=String(t.technician_remarks||'').trim();
              const technicianRemarksHtml=technicianRemarks.replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m]));
              // invoice tampil untuk semua kecuali teknisi
              const showInvoice=!isTech;
          """
          if old not in s:
              raise SystemExit('insert marker not found')
          s=s.replace(old,new,1)
          old2="""      </div>
                <div class=\"ticket-meta\">
                  <span class=\"badge ${cls}\">${smap[t.status]?.[0]||'?'}</span>
          """
          new2="""      </div>
                ${technicianRemarksHtml?`<div class=\"pxl-native-remarks-inline\" style=\"display:block;width:100%;max-width:100%;box-sizing:border-box;margin:7px 0 5px;padding:7px 10px;border-left:3px solid #D97706;background:var(--amber-bg,#FAEEDA);color:var(--amber,#854F0B);font-size:11px;line-height:1.45;border-radius:0 7px 7px 0;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;clear:both\">Remarks: ${technicianRemarksHtml}</div>`:''}
                <div class=\"ticket-meta\">
                  <span class=\"badge ${cls}\">${smap[t.status]?.[0]||'?'}</span>
          """
          if old2 not in s:
              raise SystemExit('render marker not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          t=Path('tests/pxl-vnext-2c2-remarks.test.js')
          t.write_text("""const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const index=fs.readFileSync('public/index.html','utf8');

          test('Daftar Tiket renders technician remarks natively before ticket meta',()=>{
            const renderStart=index.indexOf('function renderTickets(){');
            assert.ok(renderStart>=0,'renderTickets must exist');
            const renderEnd=index.indexOf('/* ══ PXL-REV-0064',renderStart);
            const block=index.slice(renderStart,renderEnd);
            assert.match(block,/technician_remarks/,'renderTickets must use technician_remarks directly');
            assert.match(block,/pxl-native-remarks-inline/,'renderTickets must emit the remarks inline element natively');
            const remarksPos=block.indexOf('pxl-native-remarks-inline');
            const metaPos=block.indexOf('<div class=\"ticket-meta\">');
            assert.ok(remarksPos>=0&&metaPos>=0&&remarksPos<metaPos,'remarks should render before ticket meta');
          });
          """)
          PY
      - name: Verify
        run: |
          node --test tests/vnext-1b.test.js tests/vnext-1c.test.js tests/vnext-1c1.test.js tests/vnext-2a.test.js tests/vnext-2b.test.js tests/vnext-2b1.test.js tests/vnext-2c.test.js tests/pxl-vnext-2c2-remarks.test.js
          node --check server.js
          git diff --check
      - name: Commit fix and cleanup workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html tests/pxl-vnext-2c2-remarks.test.js
          git rm .github/workflows/pxl-vnext-2c2-remarks.yml
          git commit -m 'PXL-VNEXT-2C2 restore native WO remarks display'
          git push origin main
