name: PXL VNext 3B Apply
on:
  push:
    branches: [pxl-vnext-3b]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pxl-vnext-3b
          fetch-depth: 0
      - name: Apply Phase 3B patch
        run: |
          cat .pxl-vnext-3b.patch.part1 .pxl-vnext-3b.patch.part2 > .pxl-vnext-3b.patch
          git apply --check .pxl-vnext-3b.patch
          git apply .pxl-vnext-3b.patch
      - name: Verify Phase 3B
        run: |
          node --test tests/*.test.js
          node --check server.js
          node --check db-core.js
          node --check project-vnext-3b.js
          node --check public/pxl-vnext-3b-project-mr.js
          node --check public/pxl-vnext-3a-project-detail.js
          node --check public/pxl-stg-0016-project-report.js
          git diff --check
      - name: Commit Phase 3B branch
        run: |
          rm -f .pxl-vnext-3b.patch .pxl-vnext-3b.patch.part1 .pxl-vnext-3b.patch.part2 .github/workflows/pxl-vnext-3b-apply.yml
          git config user.name 'PixelApps Deployment'
          git config user.email 'actions@users.noreply.github.com'
          git add PXL-VNEXT-3B-MIGRATION.sql db-core.js project-vnext-3b.js public/index.html public/pxl-stg-0016-project-report.js public/pxl-vnext-3a-project-detail.js public/pxl-vnext-3b-project-mr.js server.js tests/vnext-3a-project-ui.test.js tests/vnext-3b-project-mr-api.test.js tests/vnext-3b-project-mr-core.test.js tests/vnext-3b-project-mr-inventory.test.js tests/vnext-3b-project-mr-lifecycle-ui.test.js tests/vnext-3b-project-mr-requester-ui.test.js tests/vnext-3b-regression.test.js
          git commit -m 'PXL-VNEXT-3B implement Project Material Request'
          git push origin HEAD:pxl-vnext-3b
