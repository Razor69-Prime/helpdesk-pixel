<!DOCTYPE html>
<!-- PXL-REV-0033: grouped navigation package path fix -->

<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#E07B39"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Helpdesk"/>
<title>PixelApps — Pixel Solusindo</title>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F8FB;--surface:#FFF;--surface2:#F8FAFC;--border:#E5EAF0;
  --text:#111827;--muted:#667085;--accent:#E98B4D;--accent-light:#FFF3E8;
  --green:#3B6D11;--green-bg:#EAF3DE;--amber:#854F0B;--amber-bg:#FAEEDA;
  --blue:#185FA5;--blue-bg:#E6F1FB;--red:#A32D2D;--red-bg:#FCEBEB;
  --purple:#3C3489;--purple-bg:#EEEDFE;--teal:#0F6E56;--teal-bg:#E0F4EF;
  --radius:10px;--radius-sm:6px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
body{font-family:'Inter','DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;overflow-x:hidden}

#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.login-logo-dot{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
.login-logo-text{font-size:15px;font-weight:600;line-height:1.3}
.login-logo-sub{font-size:12px;color:var(--muted)}
.pxl19-login-brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:24px}
.pxl19-login-brand img{display:block;width:100%;max-width:300px;height:auto;object-fit:contain;margin:0 auto 12px}
.pxl19-app-name{font-size:22px;font-weight:800;letter-spacing:-.4px;color:var(--text)}
.pxl19-app-sub{font-size:12px;color:var(--muted);margin-top:3px}
.pxl19-top-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;white-space:nowrap}
.pxl19-top-logo img{height:34px;width:auto;max-width:180px;object-fit:contain}
.pxl19-top-name{line-height:1.05}.pxl19-top-name small{display:block;font-size:9px;font-weight:500;color:var(--muted);margin-top:3px}
@media(max-width:600px){.pxl19-top-logo img{height:26px;max-width:105px}.pxl19-top-name{font-size:12px}.pxl19-top-name small{display:none}.pxl19-login-brand img{max-width:260px}}

.login-error{background:var(--red-bg);color:var(--red);border:1px solid #F09595;border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;margin-bottom:14px;display:none}
.login-error.show{display:block}
.gps-notice{background:var(--blue-bg);border:1px solid #B5D4F4;border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--blue);margin-bottom:14px}

#app{display:none;min-height:100vh;flex-direction:column}
#app.show{display:flex}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;flex-shrink:0}
.logo{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-pill{font-size:12px;border-radius:99px;padding:4px 12px;font-weight:500}
.user-pill.technician{background:var(--accent-light);color:var(--accent);border:1px solid #F5C4A0}
.user-pill.admin{background:var(--purple-bg);color:var(--purple);border:1px solid #AFA9EC}
.user-pill.accounting{background:var(--green-bg);color:var(--green);border:1px solid #C0DD97}
.user-pill.manager{background:var(--blue-bg);color:var(--blue);border:1px solid #B5D4F4}
.user-pill.superadmin{background:linear-gradient(135deg,#4A1D96,#E07B39);color:#fff;border:none;font-weight:700}

/* ══ NOTIFIKASI ══ */
.notif-bell:hover{background:var(--border)}
.notif-item{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;position:relative}
.notif-item:hover{background:var(--surface2)}
.notif-item.unread{background:var(--accent-light)}
.notif-item.unread::before{content:'';position:absolute;left:5px;top:16px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.notif-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.notif-icon.tiket{background:var(--blue-bg)}
.notif-icon.kunjungan{background:#E3EEFB}
.notif-icon.pr{background:var(--accent-light)}
.notif-icon.mr{background:var(--green-bg)}
.notif-icon.project{background:#FBE9D0}
.notif-icon.invoice{background:#E3F2EA}
.notif-content{flex:1;min-width:0}
.notif-text{font-size:12px;line-height:1.4;color:var(--text)}
.notif-time{font-size:10.5px;color:var(--muted);margin-top:2px}
.notif-empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:12px}
.logout-btn{font-size:12px;color:var(--muted);cursor:pointer;border:none;background:none;font-family:'DM Sans',sans-serif}
.logout-btn:hover{color:var(--red)}
.conn-dot{width:7px;height:7px;border-radius:50%;background:#ccc;transition:background .3s}
.conn-dot.ok{background:#639922}.conn-dot.err{background:#E24B4A}
.main{display:none} /* diganti app-content + sidebar */

.nav{display:none} /* nav horizontal dihapus, diganti sidebar */

/* ── SIDEBAR ── */
#app-body{display:flex;flex:1;min-height:0;overflow-x:hidden}
.sidebar{width:200px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;overflow-x:hidden}
.sidebar-section{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:8px 8px 4px;margin-top:4px}
.sidebar-section:first-child{margin-top:0}
.sidebar-section-line{height:1px;background:var(--border);margin:5px 8px 2px}
.sidebar-group{width:100%}
.sidebar-group-toggle{width:100%;border:none;background:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:9px 8px 6px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;text-align:left;border-radius:var(--radius-sm)}
.sidebar-group-toggle:hover{background:var(--surface2);color:var(--text)}
.sidebar-group-arrow{font-size:11px;transition:transform .18s ease;flex-shrink:0}
.sidebar-group.collapsed .sidebar-group-arrow{transform:rotate(-90deg)}
.sidebar-group-content{display:flex;flex-direction:column;gap:2px}
.sidebar-group.collapsed .sidebar-group-content{display:none}
.sidebar-group.has-active>.sidebar-group-toggle{color:var(--accent)}
.app-content{flex:1;min-width:0;padding:20px 28px;overflow-y:auto;overflow-x:hidden}
@media(max-width:700px) and (min-width:601px){
  .sidebar{width:52px;padding:8px 4px}
  .sidebar .nav-btn span.nav-label{display:none}
  .sidebar .nav-btn{justify-content:center;padding:10px}
  .sidebar .sidebar-section,.sidebar .sidebar-section-line{display:none}
  .sidebar-group-toggle{display:none}
  .sidebar-group-content,.sidebar-group.collapsed .sidebar-group-content{display:flex}
  .app-content{padding:16px 12px}
}
.nav-btn{width:100%;padding:10px 14px;border:none;background:none;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;color:var(--muted);border-radius:var(--radius-sm);transition:all .15s;display:flex;align-items:center;justify-content:flex-start;gap:8px;text-align:left;white-space:nowrap}
.nav-btn.active{background:var(--accent-light);color:var(--accent);font-weight:600}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.card-title{font-size:14px;font-weight:600;margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:14px}
.form-group:last-child{margin-bottom:0}
label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.04em;text-transform:uppercase}
input,select,textarea{width:100%;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;transition:border .15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
input[type=file]{padding:7px 11px;cursor:pointer}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;color:var(--text);transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{opacity:.88}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.btn.green{background:var(--green-bg);color:var(--green);border-color:#C0DD97}
.btn.green:hover{background:#C0DD97}
.btn.blue{background:var(--blue-bg);color:var(--blue);border-color:#B5D4F4}
.btn.blue:hover{background:#B5D4F4}
.btn.danger{color:var(--red);border-color:#F09595;padding:4px 10px;font-size:12px}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.amber{background:var(--amber-bg);color:var(--amber);border-color:#FAC775;padding:4px 10px;font-size:12px}
.btn.amber:hover{background:#FAC775}
.btn-full{width:100%;justify-content:center;padding:11px}

.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px}
.badge.done{background:var(--green-bg);color:var(--green)}
.badge.pending{background:var(--amber-bg);color:var(--amber)}
.badge.progress{background:var(--blue-bg);color:var(--blue)}
.badge.blue{background:var(--blue-bg);color:var(--blue)}
.badge.travelling{background:#E6F1FB;color:#185FA5}
.badge.ongoing{background:#E0F4EF;color:#0F6E56}
.badge.assigned{background:var(--purple-bg);color:var(--purple)}
.role-badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px}
.role-badge.technician{background:var(--accent-light);color:var(--accent)}
.role-badge.admin{background:var(--purple-bg);color:var(--purple)}
.role-badge.accounting{background:var(--green-bg);color:var(--green)}
.role-badge.sales{background:var(--teal-bg);color:var(--teal)}
.role-badge.manager{background:var(--blue-bg);color:var(--blue)}
.role-badge.superadmin{background:linear-gradient(135deg,#4A1D96,#7C3AED);color:#fff;font-weight:700}

.stars{display:flex;gap:3px}
.star{font-size:22px;cursor:pointer;color:#D3D1C7;transition:color .1s;line-height:1;user-select:none}
.star.active{color:#BA7517}

.alert{border-radius:var(--radius-sm);padding:11px 14px;font-size:13px;margin-bottom:14px;display:none;align-items:center;gap:8px}
.alert.show{display:flex}
.alert.success{background:var(--green-bg);color:var(--green);border:1px solid #C0DD97}
.alert.error{background:var(--red-bg);color:var(--red);border:1px solid #F09595}

.ticket-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px}
.ticket-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.ticket-wo{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);font-weight:500}
.ticket-tech{font-size:14px;font-weight:600;margin-bottom:2px}
.ticket-project{font-size:12px;color:var(--muted);margin-bottom:1px}
.ticket-meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.ticket-desc{font-size:12px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.5}
.wo-desc-wrap{min-width:0}.wo-desc-content{display:grid;gap:8px}.wo-desc-note{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.wo-desc-group{border:1px solid var(--border);border-radius:9px;background:var(--surface2);overflow:hidden}
.wo-desc-label{padding:6px 9px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
.wo-desc-list{display:grid}.wo-desc-line{display:flex;align-items:flex-start;gap:7px;padding:6px 9px;border-bottom:1px solid var(--border);color:var(--text);font-size:11px;line-height:1.4}
.wo-desc-line:last-child{border-bottom:0}.wo-desc-bullet{color:var(--accent);font-weight:700;flex:0 0 auto}.wo-desc-text{min-width:0;overflow-wrap:anywhere}
.ticket-desc .wo-desc-wrap.is-collapsed .wo-desc-content{max-height:4.65em;overflow:hidden;position:relative}
.ticket-desc .wo-desc-wrap.is-collapsed .wo-desc-content:after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(transparent,var(--surface))}
.wo-desc-toggle{margin-top:7px;border:0;background:transparent;color:var(--blue);font-size:11px;font-weight:700;padding:0;cursor:pointer}
.ticket-actions{display:flex;align-items:center;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.status-select{font-size:12px;padding:4px 8px;border-radius:99px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500}

.invoice-section{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.invoice-section-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.invoice-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--green-bg);border:1px solid #C0DD97;border-radius:99px;font-size:12px;color:var(--green);text-decoration:none;margin:3px}
.invoice-chip:hover{background:#C0DD97}

.upload-drop{border:2px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;transition:all .15s;color:var(--muted);font-size:13px}
.upload-drop:hover,.upload-drop.dragover{border-color:var(--accent);background:var(--accent-light)}
.upload-drop-icon{font-size:32px;margin-bottom:8px}
.invoice-summary{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-top:8px;display:flex;flex-wrap:wrap;gap:12px;font-size:12px}
.invoice-summary-item{display:flex;flex-direction:column;gap:2px}
.invoice-summary-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.invoice-summary-value{font-weight:600;color:var(--text)}
.invoice-summary-value.amount{color:var(--teal);font-size:14px}
.upload-preview{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-top:10px;font-size:13px}

/* User management */
.user-table{width:100%;border-collapse:collapse}
.user-table th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 12px;text-align:left;border-bottom:2px solid var(--border);background:var(--surface2)}
.user-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.user-table tr:last-child td{border-bottom:none}
.user-table tr:hover td{background:var(--surface2)}

/* Edit user modal form */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:16px;padding:28px 24px;width:100%;max-width:420px;position:relative;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:4px}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.modal-close{position:absolute;top:16px;right:16px;border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}


/* PXL-REV-0064 — Multi upload dokumentasi foto Work Order */
.wo-photo-drop{border:1px dashed var(--border);border-radius:12px;padding:14px;background:var(--surface2)}
.wo-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.wo-photo-card{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.wo-photo-card img{display:block;width:100%;height:120px;object-fit:cover;background:var(--surface2)}
.wo-photo-info{padding:8px;font-size:11px;color:var(--muted)}
.wo-photo-caption{font-size:12px;color:var(--text);font-weight:600;margin-bottom:3px;word-break:break-word}

/* Tracking modal */
.track-link-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-family:'DM Mono',monospace;font-size:11px;word-break:break-all;color:var(--text);margin-bottom:8px;user-select:all;cursor:text}
.expiry-note{font-size:11px;color:var(--amber);text-align:center;margin-bottom:12px}
.qr-wrap{text-align:center;margin:14px 0}

.realtime-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:12px}
.pulse{width:8px;height:8px;border-radius:50%;background:#639922;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.metric{background:var(--surface2);border-radius:var(--radius);padding:16px}
.metric-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.metric-value{font-size:28px;font-weight:600;letter-spacing:-.02em}
.metric-sub{font-size:11px;color:var(--muted);margin-top:3px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.kpi-card-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
.tech-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.tech-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--accent);flex-shrink:0}
.tech-name{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-bg{flex:1;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden;min-width:40px}
.bar-fill{height:100%;border-radius:99px;background:var(--accent)}
.tech-score{font-size:12px;font-weight:600;color:var(--muted);min-width:34px;text-align:right}

.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-row input,.filter-row select{flex:1;min-width:120px}
.period-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.period-label{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.period-btn{padding:5px 12px;border:1px solid var(--border);border-radius:99px;background:var(--surface);cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;font-weight:500;color:var(--muted);transition:all .15s}
.period-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
.export-row{display:flex;justify-content:flex-end;margin-bottom:12px}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.tab-content{display:none}
.tab-content.active{display:block}

.divider{border:none;border-top:1px solid var(--border);margin:20px 0}

/* Dashboard */
.dash-period-bar{display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px}
.dash-period-label{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.dash-period-btn{padding:5px 12px;border:1px solid var(--border);border-radius:99px;background:var(--surface2);cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;font-weight:500;color:var(--muted);transition:all .15s}
.dash-period-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
.dash-date-input{font-size:12px;padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);outline:none;width:130px}
.dash-date-input:focus{border-color:var(--accent)}
.dash-metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.dash-metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.dash-metric-icon{font-size:24px;margin-bottom:8px}
.dash-metric-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.dash-metric-value{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1}
.dash-metric-sub{font-size:11px;color:var(--muted);margin-top:4px}
.dash-metric.accent{border-left:3px solid var(--accent)}
.dash-metric.green{border-left:3px solid #639922}
.dash-metric.blue{border-left:3px solid var(--blue)}
.dash-metric.teal{border-left:3px solid var(--teal)}
.dash-grid-1{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:16px}
.dash-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.dash-grid-3{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.dash-chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}

/* ══ KUNJUNGAN SAMPLE-STYLE ══ */
.kj-filter-bar{display:flex;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.kj-filter-group{display:flex;align-items:center;gap:5px;flex-wrap:wrap;border-right:1px solid var(--border);padding-right:10px}
.kj-filter-group:last-child{border-right:none}
.kj-filter-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-right:4px}
.kj-chip{background:#FBE5D6;color:#8B4513;border:1px solid #F4B183;border-radius:3px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer}
.kj-chip.active{background:#DC7633;color:#fff;border-color:#DC7633}
.kj-week-dropdown-btn{background:#FBE5D6;color:#8B4513;border:1px solid #F4B183;border-radius:3px;padding:3px 12px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;user-select:none}
.kj-week-dropdown-btn.has-selection{background:#DC7633;color:#fff;border-color:#DC7633}
.kj-week-dropdown-panel{position:absolute;top:100%;left:0;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:8px;z-index:50;min-width:160px;max-height:240px;overflow-y:auto}
.kj-week-option{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text)}
.kj-week-option:hover{background:var(--surface2)}
.kj-week-option input{cursor:pointer}
.kj-week-panel-footer{display:flex;justify-content:space-between;gap:6px;padding-top:6px;margin-top:6px;border-top:1px solid var(--border)}
.kj-week-panel-footer button{font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;color:var(--text)}
.kj-kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:center}
.kj-kpi-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.kj-kpi-val{font-size:24px;font-weight:800;color:var(--text)}
.kj-kpi-val.small{font-size:15px}
.kj-kpi-note{font-size:8px;color:var(--muted);margin-top:2px}
.kj-table{width:100%;border-collapse:collapse;font-size:11px}
.kj-table th{background:#3A2317;color:#fff;padding:7px 8px;text-align:center;font-weight:600;white-space:nowrap}
.kj-table td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text)}
.kj-table td.tl{text-align:left;font-weight:600}
.kj-table tr:nth-child(even){background:var(--surface2)}
.kj-table td.dot{font-weight:700}
.kj-table td.dot.g{color:#3B6D11}
.kj-table td.dot.am{color:#8B5A00}
.kj-table td.dot.r{color:var(--muted)}

/* ══ PROJECT TRACKER ══ */
#tab-projects,#proj-list-section{width:100%;max-width:100%;min-width:0;overflow-x:hidden}
.proj-card{width:100%;max-width:100%;min-width:0;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--border)}
.proj-filter-bar,.proj-summary-bar,.proj-table-wrap{width:100%;max-width:100%;min-width:0}
.proj-filter-bar>*{min-width:0}
.proj-filter-bar .proj-filter-select{max-width:100%}
.proj-header{background:linear-gradient(135deg,#0F1E3D,#16244A);padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;color:#fff}
.proj-header-label{font-size:10px;letter-spacing:.12em;color:#8FA3C7;font-weight:600;margin-bottom:4px}
.proj-header-title{font-size:20px;font-weight:800}
.proj-header-date{font-size:13px;font-weight:600;margin-top:2px}
.proj-filter-bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border)}
.proj-filter-select{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.proj-summary-bar{background:#16244A;display:grid;grid-template-columns:repeat(6,1fr);color:#fff}
.proj-summary-item{padding:12px 14px;border-right:1px solid rgba(255,255,255,.1)}
.proj-summary-item:last-child{border-right:none}
.proj-summary-label{font-size:9px;letter-spacing:.08em;color:#8FA3C7;font-weight:600;margin-bottom:4px}
.proj-summary-val{font-size:15px;font-weight:800;white-space:nowrap}
.proj-summary-val.green{color:#4ADE80}
.proj-summary-val.plan{color:#86EFAC}
.proj-summary-val.progress{color:#93C5FD}
.proj-summary-val.hold{color:#D1D5DB}
.proj-table-wrap{width:100%;max-width:100%;overflow-x:hidden;overflow-y:auto;max-height:calc(100vh - 330px);min-height:320px;overscroll-behavior:contain}
.proj-table{width:100%;max-width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed;min-width:0}
.proj-table thead{position:sticky;top:0;z-index:3}
.proj-table thead th{background:var(--surface2);color:var(--muted);font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:9px 7px;text-align:left;border-bottom:2px solid var(--border);white-space:normal;overflow-wrap:anywhere}
.proj-table tbody td{padding:9px 7px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text);min-width:0;overflow-wrap:anywhere}
.proj-table th:nth-child(1){width:2.5%}.proj-table th:nth-child(2){width:4%}.proj-table th:nth-child(3){width:14%}.proj-table th:nth-child(4){width:6%}.proj-table th:nth-child(5){width:9%}.proj-table th:nth-child(6){width:9%}.proj-table th:nth-child(7){width:12.5%}.proj-table th:nth-child(8){width:12.5%}.proj-table th:nth-child(9){width:7%}.proj-table th:nth-child(10){width:8.5%}.proj-table th:nth-child(11){width:6%}.proj-table th:nth-child(12){width:9%}
.proj-table{font-size:11px}
.proj-table thead th{font-size:9px;padding:8px 5px}
.proj-table tbody td{padding:8px 5px}
.proj-table td:nth-child(12){white-space:normal!important}
.proj-table td:nth-child(12) .btn{padding:4px 6px;font-size:10px;min-width:28px;justify-content:center}
.proj-table td:nth-child(12){display:flex;gap:3px;align-items:flex-start;flex-wrap:nowrap}
.proj-name{font-size:11.5px}
.proj-issue-text,.proj-action-text{font-size:10.5px;line-height:1.4}
.proj-pic-desa-name,.proj-target-week{font-size:10.5px}
.proj-pic-desa-phone{font-size:10px}
.proj-table tbody tr:hover{background:var(--surface2)}
.proj-no-col{color:var(--muted);font-weight:600}
.proj-prior-badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700}
.proj-prior-badge.p1{background:#FEE2E2;color:#DC2626}
.proj-prior-badge.p2{background:#FEF3C7;color:#B45309}
.proj-name{font-weight:700;color:var(--text);font-size:12.5px}
.proj-harga-pokok{color:#2563EB;font-weight:600;font-family:ui-monospace,monospace;white-space:nowrap;font-size:11.5px}
.proj-omset{color:#16A34A;font-weight:600;font-family:ui-monospace,monospace;white-space:nowrap;font-size:11.5px}
.proj-status-badge{display:inline-block;padding:4px 11px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap}
.proj-status-badge.plan{background:#DCFCE7;color:#15803D}
.proj-status-badge.progress{background:#DBEAFE;color:#1D4ED8}
.proj-status-badge.hold{background:var(--surface2);color:var(--muted)}
.proj-pic-desa-name{font-weight:600;color:var(--text);font-size:11.5px}
.proj-pic-desa-phone{color:var(--blue);font-size:11px;margin-top:2px}
.proj-issue-text{color:var(--muted);font-size:11.5px;line-height:1.5;max-width:200px}
.proj-action-text{color:var(--text);font-size:11.5px;line-height:1.5;max-width:200px}
.proj-target-week{font-weight:600;color:var(--muted);font-size:11.5px}
.proj-history-toggle{font-size:10.5px;color:var(--blue);cursor:pointer;margin-top:5px;font-weight:600}
.proj-history-entry{padding:8px 0;border-bottom:1px dashed var(--border);font-size:12px}
.proj-history-entry:last-child{border-bottom:none}
.proj-history-date{color:var(--muted);font-weight:600;font-size:11px;margin-bottom:3px}
.proj-catatan{padding:14px 18px;background:var(--surface2);border-top:1px solid var(--border)}
.proj-catatan-title{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}

/* Overdue list di dashboard */
.proj-overdue-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--surface)}
.proj-overdue-item:last-child{margin-bottom:0}
.proj-overdue-badge{flex-shrink:0;width:52px;text-align:center;padding:6px 4px;border-radius:8px;font-size:10px;font-weight:700;line-height:1.2}
.proj-overdue-badge.urgent{background:#FEE2E2;color:#DC2626}
.proj-overdue-badge.warn{background:#FEF3C7;color:#B45309}
.proj-overdue-info{flex:1;min-width:0}
.proj-overdue-name{font-weight:700;font-size:13px;color:var(--text);margin-bottom:2px}
.proj-overdue-meta{font-size:11px;color:var(--muted)}
.proj-overdue-issue{font-size:11.5px;color:var(--text);margin-top:4px;line-height:1.4}
.proj-overdue-status{flex-shrink:0}

@media(max-width:900px){
  .proj-summary-bar{grid-template-columns:repeat(3,1fr)}
}
.dash-chart-title{font-size:13px;font-weight:600;margin-bottom:4px}
.dash-chart-sub{font-size:11px;color:var(--muted);margin-bottom:16px}
.dash-canvas-wrap{position:relative;width:100%}
/* bar chart */
.dash-bar-list{display:flex;flex-direction:column;gap:10px}
.dash-bar-row{display:flex;align-items:center;gap:10px}

.dash-bar-fill{height:100%;border-radius:99px;transition:width .5s}

.donut-legend-val{font-weight:600;color:var(--muted)}
/* line chart */
.line-chart-wrap{position:relative;overflow:hidden}
.no-data{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}

/* PXL-SIDEBAR-UI-0001 — compact flat primary navigation */
.sidebar{
  width:252px;
  padding:16px 10px 18px;
  background:#fff;
  border-right:1px solid #e7ebf0;
  gap:0;
}
.sidebar-group{margin:0 0 4px}
.sidebar-group-toggle{
  display:flex!important;
  width:100%;
  min-height:34px;
  padding:8px 12px 6px;
  border:0;
  background:transparent;
  color:#7b879d;
  font-family:'Inter','DM Sans',sans-serif;
  font-size:10px;
  font-weight:700;
  letter-spacing:.055em;
  text-transform:uppercase;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  cursor:pointer;
  border-radius:8px;
}
.sidebar-group-toggle:hover{background:#f8fafc;color:#53627d}
.sidebar-group-arrow{font-size:11px;transition:transform .18s ease;color:#98a2b3}
.sidebar-group.collapsed .sidebar-group-arrow{transform:rotate(-90deg)}
.sidebar-group-content{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.sidebar-group.collapsed .sidebar-group-content{display:none!important}
.sidebar-group.has-active>.sidebar-group-toggle{color:#f05a18}
.nav-btn{
  position:relative;
  width:100%;
  min-height:42px;
  padding:10px 14px;
  border-radius:10px;
  color:#53627d;
  font-family:'Inter','DM Sans',sans-serif;
  font-size:13px;
  font-weight:500;
  gap:12px;
  background:transparent;
}
.nav-btn:hover{background:#f8fafc;color:#344054}
.nav-btn.active{
  background:linear-gradient(90deg,#fff2eb 0%,#fde8dd 100%);
  color:#f05a18;
  font-weight:600;
  box-shadow:none;
}
.nav-btn.active::before{
  content:'';
  position:absolute;
  left:0;
  top:8px;
  bottom:8px;
  width:2px;
  border-radius:999px;
  background:#f05a18;
}
.nav-icon{
  width:20px;
  height:20px;
  flex:0 0 20px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:#52627f;
}
.nav-icon svg{width:20px;height:20px;display:block;stroke:currentColor}
.nav-btn.active .nav-icon{color:#f05a18}
.nav-label{line-height:1.1}
@media(max-width:700px) and (min-width:601px){
  .sidebar{width:56px;padding:12px 5px}
  .sidebar .nav-btn{padding:10px;justify-content:center}
  .sidebar .nav-icon{width:20px;height:20px}
}
