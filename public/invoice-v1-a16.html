<body>
<div class="bar"><div><b>Helpdesk Pixel · Invoice</b><small style="display:block;color:#777">PXL-STG-0008A28</small></div><div class="actions"><button class="btn" onclick="window.parent===window?location.href='/':window.parent.postMessage({type:'PXL_INVOICE_CLOSE'},location.origin)">← Kembali</button><button id="newBtn" class="btn primary">+ Draft Invoice</button></div></div>
<main class="wrap"><section class="card"><div id="msg" class="msg">Memuat...</div><div id="app"></div></section></main>
<script>
(function(){
'use strict';
const S={rows:[],sources:{sales_orders:[],work_orders:[],customers:[]},user:null};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(+v||0);
const text=(...values)=>values.find(v=>String(v??'').trim())??'';
const arr=v=>Array.isArray(v)?v:[];
const lower=v=>String(v??'').trim().toLowerCase();
async function api(u,o={}){const binary=o.responseType==='blob',fetchOptions={...o};delete fetchOptions.responseType;let r;if(window.parent&&window.parent!==window&&typeof window.parent.__pxlInvoiceFetch==='function'){r=await window.parent.__pxlInvoiceFetch(u,fetchOptions);}else{const t=localStorage.getItem('pixel_token')||sessionStorage.getItem('pixel_token')||'';r=await fetch(u,{...fetchOptions,cache:'no-store',headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{}),...(fetchOptions.headers||{})}});}if(binary){if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||d.message||'HTTP '+r.status)}return r.blob()}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||'HTTP '+r.status);return d}
function msg(t,b=false){$('#msg').textContent=t||'';$('#msg').className='msg'+(b?' bad':'')}
function role(){return lower(S.user?.role)}
function acc(){return ['accounting','admin','superadmin'].includes(role())}
function mgr(){return ['manager','admin','superadmin'].includes(role())}
function status(v){return({draft:'Draft',pending_approval:'Menunggu Persetujuan',approved:'Disetujui',issued:'Terbit',partially_paid:'Terbayar Sebagian',paid:'Lunas'}[v]||v||'-')}
async function boot(){try{S.user=(await api('/api/me')).user;$('#newBtn').style.display=acc()?'':'none';await refresh()}catch(e){msg(e.message,true)}}
async function refresh(){try{msg('Memuat...');[S.rows,S.sources]=await Promise.all([api('/api/invoice-v1'),api('/api/invoice-v1/sources')]);S.sources.customers=arr(S.sources.customers);if(!S.sources.customers.length){try{const report=await api('/api/crm/report');S.sources.customers=arr(report.customers)}catch(_){}}list();msg('')}catch(e){msg(e.message,true)}}
function list(){$('#app').innerHTML='<div class="toolbar"><input id="q" placeholder="Cari nomor, customer, SO, atau WO"><select id="st"><option value="">Semua status</option><option value="draft">Draft</option><option value="pending_approval">Menunggu Persetujuan</option><option value="issued">Terbit</option></select><button class="btn" id="reload">Muat Ulang</button></div><div class="table"><table><thead><tr><th>Nomor</th><th>Customer</th><th>SO</th><th>WO</th><th>Jenis</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+((S.rows||[]).map(r=>{const wo=arr(r.work_order_numbers).join(' '),key=((r.invoice_number||r.temporary_number||'')+' '+(r.customer_name_snapshot||'')+' '+(r.source_so_number||'')+' '+wo).toLowerCase(),pdf=['issued','partially_paid','paid'].includes(r.invoice_status)?'<button class="btn pdf" data-id="'+esc(r.id)+'">PDF</button>':'';return '<tr data-k="'+esc(key)+'" data-s="'+esc(r.invoice_status||'')+'"><td><b>'+esc(r.invoice_number||r.temporary_number||'-')+'</b></td><td>'+esc(r.customer_name_snapshot||'-')+'</td><td class="ref-cell">'+esc(r.source_so_number||'-')+'</td><td class="ref-cell">'+(arr(r.work_order_numbers).map(n=>'<small>'+esc(n)+'</small>').join('')||'-')+'</td><td>'+esc(r.invoice_type||'-')+'</td><td>'+money(r.total_amount)+'</td><td><span class="badge">'+esc(status(r.invoice_status))+'</span></td><td><button class="btn open" data-id="'+esc(r.id)+'">Buka</button> '+pdf+'</td></tr>'}).join('')||'<tr><td colspan="8" class="empty">Belum ada invoice baru.</td></tr>')+'</tbody></table></div>';$('#reload').onclick=refresh;$('#q').oninput=filter;$('#st').onchange=filter;document.querySelectorAll('.open').forEach(b=>b.onclick=async()=>detail(await api('/api/invoice-v1/'+b.dataset.id)));document.querySelectorAll('.pdf').forEach(b=>b.onclick=()=>downloadPdf(b.dataset.id))}
function filter(){const q=$('#q').value.toLowerCase(),s=$('#st').value;document.querySelectorAll('tbody tr[data-k]').forEach(tr=>tr.hidden=!(tr.dataset.k.includes(q)&&(!s||tr.dataset.s===s)))}
function opts(rows,a,b){return arr(rows).map(x=>'<option value="'+esc(x.id)+'">'+esc(x[a]||x[b]||x.project_name||x.title||x.id)+'</option>').join('')}
function sourceLabel(type){if(type==='inventory')return['Inventory',''];if(type==='so_service')return['Jasa SO','service'];if(type==='so_material')return['Material SO',''];if(type==='technician_report')return['Laporan Teknisi','service'];return['Manual','manual']}
function isDirectInvoice(x={}){return lower(x.source_type)==='direct_sales'||x.approval_required===false}
function item(x={}){const sourceType=x.source_type||'manual',label=sourceLabel(sourceType);return '<div class="item" data-auto="'+(sourceType.startsWith('so_')?'so':'manual')+'"><div class="source-badge '+label[1]+'">'+label[0]+'</div><input type="hidden" name="source_type" value="'+esc(sourceType)+'"><input type="hidden" name="source_id" value="'+esc(x.source_id||x.inventory_item_id||'')+'"><input name="item_name" value="'+esc(x.item_name||x.name||'')+'" placeholder="Nama item/jasa" required><input name="description" value="'+esc(x.description||x.notes||'')+'" placeholder="Deskripsi"><input name="quantity" type="number" min="0.0001" step="0.0001" value="'+esc(x.quantity??x.qty??1)+'"><input name="unit" value="'+esc(x.unit||'pcs')+'"><input name="unit_price" type="number" min="0" step="0.01" value="'+esc(x.unit_price??x.price??0)+'"><button type="button" class="btn del">×</button></div>'}
function field(f,n){return f?.elements?.[n]}
function setv(f,n,v){const el=field(f,n);if(el)el.value=v??''}
function addDays(v,n){const p=String(v||'').split('-').map(Number);if(p.length!==3||!p[0])return'';const d=new Date(p[0],p[1]-1,p[2]);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function lockAutoFields(f,locked){['customer_name','sales_pic','billing_address'].forEach(n=>{const el=field(f,n);if(!el)return;el.readOnly=locked;el.classList.toggle('readonly',locked);el.title=locked?'Terisi otomatis dari Sales Order':''})}
function findCustomer(so){return arr(S.sources.customers).find(c=>String(c.id)===String(so?.customer_id||''))||null}
function relatedWorkOrders(so){if(!so)return[];const ids=new Set([so.linked_work_order_id,so.linked_crm_work_order_id,...arr(so.work_order_ids)].filter(Boolean).map(String));const soId=String(so.id||''),soNo=lower(so.so_number);return arr(S.sources.work_orders).filter(wo=>ids.has(String(wo.id))||[wo.sales_order_id,wo.source_so_id,wo.so_id].some(v=>String(v||'')===soId)||(soNo&&lower(wo.so_number)===soNo))}
function salesOrderItems(so){const direct=arr(so?.items);if(direct.length)return direct;return [...arr(so?.material_items).map(x=>({...x,item_type:'item'})),...arr(so?.service_items).map(x=>({...x,item_type:'service'}))]}
function blankManualRow(row){return row?.dataset.auto==='manual'&&!row.querySelector('[name=item_name]')?.value.trim()&&!row.querySelector('[name=description]')?.value.trim()}
function applySalesOrder(){const f=$('#f'),select=field(f,'source_so_id');if(!f||!select)return;const so=arr(S.sources.sales_orders).find(x=>String(x.id)===String(select.value));if(!so){lockAutoFields(f,false);return}const customer=findCustomer(so);setv(f,'customer_name',text(so.customer_name,customer?.name));setv(f,'customer_pic',text(so.customer_pic,so.customer_pic_name,so.pic_name,so.contact_person,customer?.customer_pic,customer?.pic_name,customer?.contact_person,customer?.contact_name));setv(f,'sales_pic',text(so.sales_pic,customer?.sales_pic));setv(f,'billing_address',text(so.address,so.location,so.billing_address,customer?.address));lockAutoFields(f,true);const related=relatedWorkOrders(so),woSelect=field(f,'work_order_ids'),relatedIds=new Set(related.map(x=>String(x.id)));if(woSelect)[...woSelect.options].forEach(option=>option.selected=relatedIds.has(String(option.value)));document.querySelectorAll('#items .item[data-auto="so"]').forEach(row=>row.remove());document.querySelectorAll('#items .item').forEach(row=>{if(blankManualRow(row))row.remove()});const lines=salesOrderItems(so).map(line=>{const kind=lower(line.item_type||line.type);return{...line,source_type:['service','jasa'].includes(kind)?'so_service':'so_material',source_id:line.id||line.inventory_item_id||so.id,item_name:text(line.item_name,line.name),quantity:line.quantity??line.qty??1,unit_price:line.unit_price??line.price??0}});if(lines.length)$('#items').insertAdjacentHTML('afterbegin',lines.map(item).join(''));if(!document.querySelector('#items .item'))$('#items').innerHTML=item();bind();calc();const pic=field(f,'customer_pic')?.value.trim();const notes=[];notes.push('SO '+(so.so_number||'terpilih')+': '+related.length+' WO dan '+lines.length+' item/jasa dimuat otomatis.');if(!pic)notes.push('Customer PIC belum tersedia, silakan isi.');msg(notes.join(' '),!pic)}
function form(d={}){const direct=(d.source_type||'sales_order')==='direct_sales',inventoryRows=arr(S.sources.inventory_items),salesOpts=arr(S.sources.sales_users).map(u=>'<option value="'+esc(u.name||u.username||'')+'">'+esc(u.name||u.username||'-')+'</option>').join(''),inventoryLabel=i=>(i.sku?i.sku+' · ':'')+i.name+' · stok '+Number(i.stock||0)+' '+(i.unit||'pcs'),invOpts=inventoryRows.map(i=>'<option value="'+esc(inventoryLabel(i))+'"></option>').join(''),initialItems=d.items?.length?d.items.map(item).join(''):(direct?'':item());$('#app').innerHTML='<div class="actions"><button class="btn" id="back">← Daftar</button><button class="btn primary" id="save">Simpan Draft</button></div><h2>'+(d.id?'Edit Draft':'Draft Invoice Baru')+'</h2><form id="f"><div class="grid"><label>Sumber<select name="source_type"><option value="sales_order">Sales Order</option><option value="work_order">Work Order</option><option value="direct_sales">Direct Sales</option></select></label><label class="so-field">Sales Order<select name="source_so_id"><option value="">Pilih SO</option>'+opts(S.sources.sales_orders,'so_number','order_number')+'</select></label><label class="wo-field">Work Order<select name="work_order_ids" multiple size="4">'+opts(S.sources.work_orders,'wo_number','project_name')+'</select></label><label>Customer<input name="customer_name" required></label><label>Customer PIC<input name="customer_pic"></label><label>Sales PIC<select name="sales_pic"><option value="">Pilih Sales PIC</option>'+salesOpts+'</select></label><label class="wide">Alamat<textarea name="billing_address"></textarea></label><label>Jenis<select name="invoice_type"><option value="dp">DP</option><option value="term">Termin</option><option value="full_payment">Full Payment</option></select></label><label>Nama Termin<input name="term_name"></label><label>Persentase Termin<input name="term_percent" type="number" min="0" max="100" step="0.01"></label><label>Tanggal<input name="invoice_date" type="date" required></label><label>Jatuh Tempo<input name="due_date" type="date"></label><label>Pajak<select name="tax_mode"><option value="ppn">PPN</option><option value="non_ppn">Non-PPN</option></select></label><label>PPN %<input name="tax_percent" type="number" value="12"></label><label>Diskon Total<input name="invoice_discount_value" type="number" value="0"></label></div><h3>Item Material / Jasa</h3><div class="actions direct-tools"><label>Cari Item Inventory<input id="inventorySearch" list="inventoryOptions" autocomplete="off" placeholder="Ketik nama / SKU barang..."><datalist id="inventoryOptions">'+invOpts+'</datalist></label><button type="button" class="btn primary" id="addInventory">+ Tambah Inventory</button><button type="button" class="btn" id="add">+ Input Manual</button><span class="direct-note">Item Inventory memotong stok saat Direct Sales berstatus Lunas. Item manual tidak memotong stok.</span></div><div id="items">'+initialItems+'</div><div class="summary"><span>Subtotal: <b id="subtotal">Rp0</b></span><span>Total: <b id="grandtotal">Rp0</b></span></div></form>';const f=$('#f');const values={source_type:d.source_type||'sales_order',source_so_id:d.source_so_id||'',customer_name:d.customer_name_snapshot||'',customer_pic:d.customer_pic_snapshot||'',sales_pic:d.sales_pic_snapshot||'',billing_address:d.billing_address_snapshot||'',invoice_type:d.invoice_type||'full_payment',term_name:d.term_name||'',term_percent:d.term_percent||'',invoice_date:d.invoice_date||new Date().toISOString().slice(0,10),due_date:d.due_date||addDays(d.invoice_date||new Date().toISOString().slice(0,10),14),tax_mode:d.tax_mode||'ppn',tax_percent:d.tax_percent??12,invoice_discount_value:d.invoice_discount_amount??0};Object.entries(values).forEach(([n,v])=>setv(f,n,v));const selectedWoIds=new Set(arr(d.wos).map(x=>String(x.ticket_id||x.work_order_id||x.id)));[...field(f,'work_order_ids').options].forEach(o=>o.selected=selectedWoIds.has(String(o.value)));lockAutoFields(f,!!d.source_so_id);const syncSource=()=>{const isDirect=field(f,'source_type').value==='direct_sales';if(isDirect){field(f,'source_so_id').value='';[...field(f,'work_order_ids').options].forEach(o=>o.selected=false);lockAutoFields(f,false);document.querySelectorAll('#items .item').forEach(row=>{if(blankManualRow(row))row.remove()});if(!inventoryRows.length)msg('Daftar Inventory kosong/tidak dapat dimuat. Item manual tetap dapat digunakan.',true)}};$('#back').onclick=list;$('#add').onclick=()=>{$('#items').insertAdjacentHTML('beforeend',item());bind();calc()};$('#addInventory').onclick=()=>{const q=String($('#inventorySearch')?.value||'').trim().toLowerCase(),i=inventoryRows.find(x=>inventoryLabel(x).toLowerCase()===q)||inventoryRows.find(x=>String(x.sku||'').toLowerCase()===q||String(x.name||'').toLowerCase()===q)||inventoryRows.find(x=>inventoryLabel(x).toLowerCase().includes(q));if(!q||!i)return msg('Ketik nama/SKU lalu pilih item Inventory dari hasil pencarian.',true);const price=i.selling_price??i.sale_price??i.price_sell??i.unit_price??i.price??0;$('#items').insertAdjacentHTML('beforeend',item({source_type:'inventory',source_id:i.id,item_name:i.name,description:i.sku||'',quantity:1,unit:i.unit||'pcs',unit_price:price}));$('#inventorySearch').value='';bind();calc()};field(f,'source_so_id').onchange=applySalesOrder;const invDate=field(f,'invoice_date'),dueDate=field(f,'due_date');let dueManual=!!d.id&&!!d.due_date;const syncDue=()=>{if(!dueManual&&invDate?.value&&dueDate)dueDate.value=addDays(invDate.value,14)};invDate?.addEventListener('input',syncDue);invDate?.addEventListener('change',syncDue);dueDate?.addEventListener('change',e=>{if(e.isTrusted)dueManual=true});syncDue();$('#save').onclick=async()=>{try{await api(d.id?'/api/invoice-v1/'+d.id:'/api/invoice-v1',{method:d.id?'PATCH':'POST',body:JSON.stringify(collect())});await refresh()}catch(e){msg(e.message,true)}};bind();const sourceEl=field(f,'source_type');if(sourceEl){sourceEl.oninput=()=>{syncSource();calc()};sourceEl.onchange=()=>{syncSource();calc()}}syncSource();calc()}
function bind(){document.querySelectorAll('#f input,#f select,#f textarea').forEach(x=>{if(x.name!=='source_so_id')x.oninput=calc});document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{b.closest('.item').remove();calc()})}
function calc(){let subtotal=0;document.querySelectorAll('#items .item').forEach(r=>subtotal+=(+r.querySelector('[name=quantity]').value||0)*(+r.querySelector('[name=unit_price]').value||0));const f=$('#f');if(!f)return;const discount=+field(f,'invoice_discount_value').value||0,base=Math.max(0,subtotal-discount),total=field(f,'tax_mode').value==='non_ppn'?base:base*(1+(+field(f,'tax_percent').value||12)/100);if($('#subtotal'))$('#subtotal').textContent=money(subtotal);if($('#grandtotal'))$('#grandtotal').textContent=money(total)}
function collect(){const f=$('#f'),o=Object.fromEntries(new FormData(f).entries());o.work_order_ids=[...field(f,'work_order_ids').selectedOptions].map(x=>x.value);o.items=[...document.querySelectorAll('#items .item')].map(r=>Object.fromEntries([...r.querySelectorAll('input,select,textarea')].map(x=>[x.name,x.value])));return o}
function detail(x){const issued=['issued','partially_paid','paid'].includes(x.invoice_status),direct=isDirectInvoice(x),wos=arr(x.wos).map(w=>w.wo_number||w.ticket_id).filter(Boolean).join(', ')||'-',approval=direct?'Langsung Terbit · tanpa approval Manager':(x.approved_at?('Disetujui oleh '+x.approved_by+' · '+new Date(x.approved_at).toLocaleString('id-ID')):(x.rejected_at?('Dikembalikan oleh '+x.rejected_by+' · '+(x.rejection_reason||'-')):'Persetujuan Manager wajib sebelum terbit')),field=(l,v,c='')=>'<div class="detail-item '+c+'"><div class="detail-label">'+l+'</div><div class="detail-value">'+esc(v||'-')+'</div></div>',lines=arr(x.items),lineRows=lines.map((i,n)=>{const qty=Number(i.quantity||i.qty||0),price=Number(i.unit_price||i.price||0),total=Number(i.line_total??i.total_amount??qty*price),desc=i.description?'<span class="line-desc">'+esc(i.description)+'</span>':'';return '<tr><td>'+(n+1)+'</td><td class="line-name">'+esc(i.item_name||i.name||'-')+desc+'</td><td class="number">'+qty+' '+esc(i.unit||'pcs')+'</td><td class="number">'+money(price)+'</td><td class="number"><b>'+money(total)+'</b></td></tr>'}).join('')||'<tr><td colspan="5" class="empty">Belum ada rincian item atau jasa.</td></tr>',lineTotal=lines.reduce((s,i)=>s+Number(i.line_total??i.total_amount??Number(i.quantity||i.qty||0)*Number(i.unit_price||i.price||0)),0);$('#app').innerHTML='<div class="actions"><button class="btn" id="back">← Daftar</button>'+(issued?'<button class="btn" id="pdf">⬇ Download PDF</button>':'')+(direct&&['issued','partially_paid'].includes(x.invoice_status)&&acc()?'<button class="btn primary" id="paid">Tandai Lunas</button>':'')+(x.invoice_status==='draft'&&acc()?'<button class="btn" id="edit">Edit</button>'+(direct?'<button class="btn primary" id="issue">Terbitkan</button>':'<button class="btn primary" id="submit">Ajukan Approval</button>'):'')+(direct&&['issued','partially_paid'].includes(x.invoice_status)&&acc()?'<button class="btn" id="edit">Edit</button>':'')+(x.invoice_status==='pending_approval'&&mgr()?'<button class="btn" id="reject">Kembalikan untuk Revisi</button><button class="btn primary" id="approve">Setujui</button>':'')+(x.invoice_status==='approved'&&!direct&&acc()?'<button class="btn primary" id="issue">Terbitkan</button>':'')+'</div><div class="detail-head"><div><h2>'+esc(x.invoice_number||x.temporary_number||'-')+'</h2><div class="detail-sub">'+(direct?'Direct Sales tanpa SO/WO · stok dan omzet diproses saat Lunas.':'Periksa rincian item dan jasa sebelum menyetujui Invoice.')+'</div></div><span class="badge detail-status">'+esc(status(x.invoice_status))+'</span></div><div class="detail-grid">'+field('Customer',x.customer_name_snapshot,'wide')+field('Customer PIC',x.customer_pic_snapshot)+field('Sales PIC',x.sales_pic_snapshot)+field('Nomor SO',x.source_so_number)+field('Nomor WO',wos,'wide')+field(direct?'Proses':'Status Approval',approval,'wide')+field('Tanggal Invoice',x.invoice_date)+field('Jatuh Tempo',x.due_date||'Tidak ditentukan')+field('Jenis / Termin',(x.invoice_type||'-')+(x.term_name?' · '+x.term_name:''))+'</div><section class="detail-lines"><h3>Rincian Item & Jasa</h3><table><thead><tr><th>No.</th><th>Item / Jasa</th><th class="number">Qty</th><th class="number">Harga Satuan</th><th class="number">Subtotal</th></tr></thead><tbody>'+lineRows+'</tbody></table><div class="detail-total"><span>Total Rincian: <b>'+money(lineTotal)+'</b></span><span>Total Invoice: <b>'+money(x.total_amount)+'</b></span></div></section><div class="detail-grid" style="margin-top:9px">'+field('Terbayar',money(x.paid_amount||0))+field('Sisa Piutang',money(x.balance_amount==null?x.total_amount:x.balance_amount))+'</div>';$('#back').onclick=list;if($('#pdf'))$('#pdf').onclick=()=>downloadPdf(x.id);if($('#edit'))$('#edit').onclick=()=>form(x);if($('#submit'))$('#submit').onclick=()=>act(x.id,'submit');if($('#approve'))$('#approve').onclick=()=>act(x.id,'approve');if($('#reject'))$('#reject').onclick=()=>{const r=prompt('Alasan pengembalian untuk revisi:');if(r)act(x.id,'reject',{reason:r})};if($('#issue'))$('#issue').onclick=()=>act(x.id,'issue',{});if($('#paid'))$('#paid').onclick=()=>{if(confirm('Tandai Direct Sales ini LUNAS? Stok item Inventory akan dikurangi dan transaksi masuk omzet.'))act(x.id,'payment',{mark_paid:true,note:'Pelunasan Direct Sales'})}}
async function downloadPdf(id){try{const blob=await api('/api/invoice-v1/'+encodeURIComponent(id)+'/pdf',{responseType:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='invoice.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){msg(e.message,true)}}
async function act(id,a,b){try{await api('/api/invoice-v1/'+id+'/'+a,{method:'POST',body:JSON.stringify(b||{})});await refresh()}catch(e){msg(e.message,true)}}
$('#newBtn').onclick=()=>form();boot();
})();
</script>
