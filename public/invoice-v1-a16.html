<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice - Staging</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f7f4f1;color:#222}.top{background:#8b2d12;color:#fff;padding:14px;text-align:center;font-weight:700}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 20px;background:#fff;border-bottom:1px solid #ddd}.wrap{padding:18px;max-width:1400px;margin:auto}.card{background:#fff;border:1px solid #ddd6ce;border-radius:14px;padding:16px}.btn{border:1px solid #d7cec6;background:#fff;border-radius:8px;padding:10px 14px;cursor:pointer}.primary{background:#ea7b2d;color:#fff;border-color:#ea7b2d}.toolbar,.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.toolbar input,.toolbar select,input,select,textarea{box-sizing:border-box;padding:10px;border:1px solid #d8d1ca;border-radius:8px;background:#fff}.toolbar input{min-width:240px}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid label{display:grid;gap:5px;font-weight:700;font-size:13px}.wide{grid-column:1/-1}.item{display:grid;grid-template-columns:2fr 2fr 90px 90px 130px 45px;gap:7px;margin:8px 0}.msg{min-height:20px;margin:8px 0}.bad{color:#b42318}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee}.empty{text-align:center;color:#777}@media(max-width:800px){.bar,.grid{display:block}.bar>*{margin:6px 0}.item{grid-template-columns:1fr 1fr}.wrap{padding:10px}}</style></head><body><div class="top">⚠ STAGING / DATA UJI — BUKAN SERVER LIVE</div><div class="bar"><div><b>Helpdesk Pixel · Invoice</b><small style="display:block;color:#777">PXL-STG-0008A16</small></div><div class="actions"><button class="btn" onclick="window.parent===window?location.href='/':window.parent.postMessage({type:'PXL_INVOICE_CLOSE'},location.origin)">← Kembali</button><button id="newBtn" class="btn primary">+ Draft Invoice</button></div></div><main class="wrap"><section class="card"><div id="msg" class="msg">Memuat...</div><div id="app"></div></section></main><script>(function(){'use strict';const S={rows:[],sources:{sales_orders:[],work_orders:[]},user:null};const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(+v||0);async function api(u,o={}){let r;if(window.parent&&window.parent!==window&&typeof window.parent.__pxlInvoiceFetch==='function'){r=await window.parent.__pxlInvoiceFetch(u,o);}else{const t=localStorage.getItem('pixel_token')||sessionStorage.getItem('pixel_token')||'';r=await fetch(u,{...o,cache:'no-store',headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{}),...(o.headers||{})}});}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||'HTTP '+r.status);return d}function msg(t,b=false){$('#msg').textContent=t||'';$('#msg').className='msg'+(b?' bad':'')}function role(){return String(S.user?.role||'').toLowerCase()}function acc(){return ['accounting','admin','superadmin'].includes(role())}function mgr(){return ['manager','admin','superadmin'].includes(role())}function status(v){return({draft:'Draft',pending_approval:'Menunggu Persetujuan',issued:'Terbit'}[v]||v||'-')}async function boot(){try{S.user=(await api('/api/me')).user;$('#newBtn').style.display=acc()?'':'none';await refresh()}catch(e){msg(e.message,true)}}async function refresh(){try{msg('Memuat...');[S.rows,S.sources]=await Promise.all([api('/api/invoice-v1'),api('/api/invoice-v1/sources')]);list();msg('')}catch(e){msg(e.message,true)}}function list(){$('#app').innerHTML='<div class="toolbar"><input id="q" placeholder="Cari nomor/customer"><select id="st"><option value="">Semua status</option><option value="draft">Draft</option><option value="pending_approval">Menunggu Persetujuan</option><option value="issued">Terbit</option></select><button class="btn" id="reload">Muat Ulang</button></div><div class="table"><table><thead><tr><th>Nomor</th><th>Customer</th><th>Jenis</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+((S.rows||[]).map(r=>'<tr data-k="'+esc(((r.invoice_number||r.temporary_number||'')+' '+(r.customer_name_snapshot||'')).toLowerCase())+'" data-s="'+esc(r.invoice_status||'')+'"><td><b>'+esc(r.invoice_number||r.temporary_number||'-')+'</b></td><td>'+esc(r.customer_name_snapshot||'-')+'</td><td>'+esc(r.invoice_type||'-')+'</td><td>'+money(r.total_amount)+'</td><td><span class="badge">'+esc(status(r.invoice_status))+'</span></td><td><button class="btn open" data-id="'+esc(r.id)+'">Buka</button></td></tr>').join('')||'<tr><td colspan="6" class="empty">Belum ada invoice baru.</td></tr>')+'</tbody></table></div>';$('#reload').onclick=refresh;$('#q').oninput=filter;$('#st').onchange=filter;document.querySelectorAll('.open').forEach(b=>b.onclick=async()=>detail(await api('/api/invoice-v1/'+b.dataset.id)))}function filter(){const q=$('#q').value.toLowerCase(),s=$('#st').value;document.querySelectorAll('tbody tr[data-k]').forEach(tr=>tr.hidden=!(tr.dataset.k.includes(q)&&(!s||tr.dataset.s===s)))}function opts(rows,a,b){return (rows||[]).map(x=>'<option value="'+esc(x.id)+'">'+esc(x[a]||x[b]||x.project_name||x.id)+'</option>').join('')}function item(x={}){return '<div class="item"><input name="item_name" value="'+esc(x.item_name||'')+'" placeholder="Nama item/jasa" required><input name="description" value="'+esc(x.description||'')+'" placeholder="Deskripsi"><input name="quantity" type="number" min="0.0001" step="0.0001" value="'+esc(x.quantity||1)+'"><input name="unit" value="'+esc(x.unit||'pcs')+'"><input name="unit_price" type="number" min="0" value="'+esc(x.unit_price||0)+'"><button type="button" class="btn del">×</button></div>'}function form(d={}){$('#app').innerHTML='<div class="actions"><button class="btn" id="back">← Daftar</button><button class="btn primary" id="save">Simpan Draft</button></div><h2>'+(d.id?'Edit Draft':'Draft Invoice Baru')+'</h2><form id="f"><div class="grid"><label>Sumber<select name="source_type"><option value="sales_order">Sales Order</option><option value="work_order">Work Order</option></select></label><label>Sales Order<select name="source_so_id"><option value="">Pilih SO</option>'+opts(S.sources.sales_orders,'so_number','order_number')+'</select></label><label>Work Order<select name="work_order_ids" multiple size="4">'+opts(S.sources.work_orders,'wo_number','project_name')+'</select></label><label>Customer<input name="customer_name" required></label><label>Customer PIC<input name="customer_pic"></label><label>Sales PIC<input name="sales_pic"></label><label class="wide">Alamat<textarea name="billing_address"></textarea></label><label>Jenis<select name="invoice_type"><option value="dp">DP</option><option value="term">Termin</option><option value="full_payment">Full Payment</option></select></label><label>Tanggal<input name="invoice_date" type="date" required></label><label>Jatuh Tempo<input name="due_date" type="date"></label><label>Pajak<select name="tax_mode"><option value="ppn">PPN</option><option value="non_ppn">Non-PPN</option></select></label><label>PPN %<input name="tax_percent" type="number" value="12"></label><label>Diskon Total<input name="invoice_discount_value" type="number" value="0"></label></div><h3>Item Invoice</h3><button type="button" class="btn" id="add">+ Tambah Item</button><div id="items">'+((d.items?.length?d.items:[{}]).map(item).join(''))+'</div></form>';const f=$('#f');for(const [n,v] of Object.entries({source_type:d.source_type||'sales_order',source_so_id:d.source_so_id||'',customer_name:d.customer_name_snapshot||'',customer_pic:d.customer_pic_snapshot||'',sales_pic:d.sales_pic_snapshot||'',billing_address:d.billing_address_snapshot||'',invoice_type:d.invoice_type||'full_payment',invoice_date:d.invoice_date||new Date().toISOString().slice(0,10),due_date:d.due_date||'',tax_mode:d.tax_mode||'ppn',tax_percent:d.tax_percent??12}))if(f.elements[n])f.elements[n].value=v;$('#back').onclick=list;$('#add').onclick=()=>{$('#items').insertAdjacentHTML('beforeend',item());bind()};$('#save').onclick=async()=>{try{await api(d.id?'/api/invoice-v1/'+d.id:'/api/invoice-v1',{method:d.id?'PATCH':'POST',body:JSON.stringify(collect())});await refresh()}catch(e){msg(e.message,true)}};bind()}function bind(){document.querySelectorAll('.del').forEach(b=>b.onclick=()=>b.closest('.item').remove())}function collect(){const f=$('#f'),o=Object.fromEntries(new FormData(f).entries());o.work_order_ids=[...f.elements.work_order_ids.selectedOptions].map(x=>x.value);o.items=[...document.querySelectorAll('.item')].map(r=>Object.fromEntries([...r.querySelectorAll('input')].map(x=>[x.name,x.value])));return o}function detail(x){$('#app').innerHTML='<div class="actions"><button class="btn" id="back">← Daftar</button>'+(x.invoice_status==='draft'&&acc()?'<button class="btn" id="edit">Edit</button><button class="btn" id="submit">Ajukan</button><button class="btn primary" id="issue">Terbitkan</button>':'')+(x.invoice_status==='pending_approval'&&mgr()?'<button class="btn" id="reject">Tolak</button><button class="btn primary" id="approve">Setujui</button>':'')+'</div><h2>'+esc(x.invoice_number||x.temporary_number||'-')+'</h2><p><b>'+esc(x.customer_name_snapshot||'-')+'</b></p><p>Status: '+esc(status(x.invoice_status))+'</p><p>Total: <b>'+money(x.total_amount)+'</b></p>';$('#back').onclick=list;if($('#edit'))$('#edit').onclick=()=>form(x);if($('#submit'))$('#submit').onclick=()=>act(x.id,'submit');if($('#approve'))$('#approve').onclick=()=>act(x.id,'approve');if($('#reject'))$('#reject').onclick=()=>{const r=prompt('Alasan penolakan:');if(r)act(x.id,'reject',{reason:r})};if($('#issue'))$('#issue').onclick=()=>act(x.id,'issue',{})}async function act(id,a,b){try{await api('/api/invoice-v1/'+id+'/'+a,{method:'POST',body:JSON.stringify(b||{})});await refresh()}catch(e){msg(e.message,true)}}$('#newBtn').onclick=()=>form();boot()})();</script></body></html>
