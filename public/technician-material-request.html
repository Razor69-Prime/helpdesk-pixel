<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material Request Teknisi</title>
<style>:root{--bg:#f7f6f3;--card:#fff;--line:#e2ded6;--text:#1a1916;--muted:#7a7670;--accent:#e07b39;--green:#3b6d11;--greenbg:#eaf3de;--amber:#854f0b;--amberbg:#faeeda;--red:#a32d2d;--redbg:#fcebeb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,sans-serif;color:var(--text)}.wrap{max-width:1000px;margin:auto;padding:18px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:12px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn:disabled{opacity:.5;cursor:not-allowed}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700}.badge.enough,.badge.verified_signed{background:var(--greenbg);color:var(--green)}.badge.shortage,.badge.waiting_stock,.badge.waiting_technician_verification{background:var(--amberbg);color:var(--amber)}.badge.empty{background:var(--redbg);color:var(--red)}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:9px;border-top:1px solid var(--line);text-align:left}th{font-size:10px;text-transform:uppercase;color:var(--muted)}textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:9px}.sign{border:1px dashed var(--line);border-radius:8px;background:#fff;width:100%;height:150px;touch-action:none}.empty-state{text-align:center;color:var(--muted);padding:30px}.msg{position:fixed;right:16px;bottom:16px;background:#222;color:#fff;padding:10px 13px;border-radius:8px;display:none}@media(max-width:700px){table{font-size:12px}.hide-mobile{display:none}}</style></head>
<body><div class="wrap"><div class="toolbar"><div><h2 style="margin:0">Material Request Teknisi</h2><div class="sub">Hanya MR dari Work Order yang ditugaskan kepada akun teknisi ini.</div></div><div><button class="btn" onclick="location.href='/'">Kembali</button> <button class="btn" id="refresh">Refresh</button></div></div><div id="list"></div></div><div id="msg" class="msg"></div>
<script>
let runtimeToken='';function token(){try{return runtimeToken||(window.parent&&window.parent!==window?window.parent.localStorage.getItem('pixel_token'):'')||localStorage.getItem('pixel_token')||''}catch(_){return runtimeToken||''}}window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='PXL_AUTH_TOKEN')runtimeToken=e.data.token||runtimeToken});
const H=()=>({'Content-Type':'application/json',...(token()?{Authorization:'Bearer '+token()}:{})});async function api(method,url,body){const r=await fetch(url,{method,headers:H(),body:body?JSON.stringify(body):undefined});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.error||'Gagal');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){const e=document.getElementById('msg');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',4000)}
const canvases=new Map();function initCanvas(id){const c=document.getElementById(id);if(!c)return;const ctx=c.getContext('2d');function resize(){const dpr=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2;ctx.lineCap='round'}resize();let drawing=false;const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}};const start=e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()};const move=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()};const end=()=>drawing=false;c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);window.addEventListener('mouseup',end);c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end);canvases.set(id,c)}
function render(rows){const root=document.getElementById('list');if(!rows.length){root.innerHTML='<div class="card empty-state">Belum ada Material Request untuk Work Order Anda.</div>';return}root.innerHTML=rows.map(m=>`<div class="card"><div class="toolbar"><div><b>${esc(m.mr_number||'-')}</b> · ${esc(m.wo_number||'-')}<div class="sub">${esc(m.customer_name||'-')}</div></div><span class="badge ${esc(m.status)}">${esc(m.status)}</span></div><table><thead><tr><th>Item</th><th>Diminta</th><th>Stok</th><th>Kekurangan</th><th>Status</th></tr></thead><tbody>${(m.items||[]).map(i=>`<tr><td>${esc(i.name)}</td><td>${Number(i.qty_requested ?? i.qty ?? 0)} ${esc(i.unit)}</td><td>${Number(i.stock_available||0)} ${esc(i.unit)}</td><td>${Number(i.qty_shortage||0)} ${esc(i.unit)}</td><td><span class="badge ${esc(i.stock_status)}">${i.stock_status==='enough'?'Cukup':i.stock_status==='empty'?'Kosong':'Kurang'}</span></td></tr>`).join('')}</tbody></table>${m.status==='issued'?'<div class="sub" style="margin-top:10px">Material sudah dikeluarkan gudang.</div>':`<div style="margin-top:12px"><label>Catatan Teknisi</label><textarea id="note-${m.id}" placeholder="Catatan hasil pengecekan item">${esc(m.technician_note||'')}</textarea><div class="sub" style="margin:8px 0 5px">Tanda tangan teknisi</div><canvas class="sign" id="sign-${m.id}"></canvas><div class="toolbar" style="margin-top:8px"><button class="btn" data-clear="${m.id}">Hapus Tanda Tangan</button><button class="btn primary" data-verify="${m.id}">Verifikasi Material</button></div></div>`}</div>`).join('');rows.filter(m=>m.status!=='issued').forEach(m=>initCanvas('sign-'+m.id));document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{const c=canvases.get('sign-'+b.dataset.clear);c.getContext('2d').clearRect(0,0,c.width,c.height)});document.querySelectorAll('[data-verify]').forEach(b=>b.onclick=()=>verify(b.dataset.verify))}
async function verify(id){try{const c=canvases.get('sign-'+id);const signature=c.toDataURL('image/png');await api('POST','/api/crm/material-requests/'+id+'/verify',{technician_note:document.getElementById('note-'+id).value,technician_signature:signature});toast('Material Request berhasil diverifikasi');load()}catch(e){toast(e.message)}}async function load(){try{render(await api('GET','/api/crm/material-requests'))}catch(e){document.getElementById('list').innerHTML='<div class="card empty-state">'+esc(e.message)+'</div>'}}document.getElementById('refresh').onclick=load;load();
</script></body></html>
