<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Invoice - Helpdesk Pixel</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4f1}
    iframe{display:block;width:100%;height:100%;border:0;background:#f7f4f1}
  </style>
</head>
<body>
  <iframe id="invoiceFrame" src="/invoice-v1.html?v=PXL-STG-0008A7" title="Invoice"></iframe>
  <script>
  (function(){
    'use strict';
    let token='';
    try{
      token=localStorage.getItem('pixel_token')||localStorage.getItem('token')||localStorage.getItem('authToken')||localStorage.getItem('pxl_token')||'';
      if(token){
        localStorage.setItem('pixel_token',token);
        localStorage.setItem('token',token);
        localStorage.setItem('authToken',token);
        localStorage.setItem('pxl_token',token);
      }
    }catch(_){}
    if(!token){ location.replace('/'); return; }
    const frame=document.getElementById('invoiceFrame');
    frame.addEventListener('load',()=>{
      try{frame.contentWindow.postMessage({type:'PXL_AUTH_TOKEN',token},location.origin);}catch(_){}
    });
  })();
  </script>
</body>
</html>
