<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#E07B39"/>
<title>Tracking Tiket — Pixel Solusindo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F7F6F3;--surface:#FFF;--surface2:#F0EEE9;--border:#E2DED6;--text:#1A1916;--muted:#7A7670;--accent:#E07B39;--green:#3B6D11;--green-bg:#EAF3DE;--amber:#854F0B;--amber-bg:#FAEEDA;--blue:#185FA5;--blue-bg:#E6F1FB;--red:#A32D2D;--radius:10px;--radius-sm:6px;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.track-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:3px 10px}
.main{max-width:580px;margin:0 auto;padding:24px 16px}
.status-hero{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;text-align:center;margin-bottom:14px}
.status-icon{font-size:52px;margin-bottom:12px;line-height:1}
.status-label{font-size:22px;font-weight:600;margin-bottom:4px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:4px 14px;border-radius:99px;margin-bottom:12px}
.badge.done{background:var(--green-bg);color:var(--green)}
.badge.pending{background:var(--amber-bg);color:var(--amber)}
.badge.progress{background:var(--blue-bg);color:var(--blue)}
.wo-number{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.expiry-pill{display:inline-block;font-size:11px;background:var(--amber-bg);color:var(--amber);border-radius:99px;padding:3px 10px;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px}
.card-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;gap:12px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--muted);white-space:nowrap}
.info-value{font-weight:500;text-align:right;word-break:break-word;max-width:65%}
.tl-item{display:flex;gap:14px;position:relative}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:11px;top:24px;bottom:-4px;width:1px;background:var(--border)}
.tl-dot{width:23px;height:23px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:2px;z-index:1}
.tl-dot.done{border-color:#639922;background:var(--green-bg)}
.tl-dot.progress{border-color:#378ADD;background:var(--blue-bg)}
.tl-dot.pending{border-color:#EF9F27;background:var(--amber-bg)}
.tl-body{padding-bottom:14px;flex:1}
.tl-status{font-size:13px;font-weight:600}
.tl-meta{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.invoice-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;text-decoration:none;color:var(--text);transition:background .15s}
.invoice-item:hover{background:var(--border)}
.inv-icon{font-size:28px;flex-shrink:0}
.inv-body{flex:1;min-width:0}
.inv-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--blue)}
.inv-meta{font-size:11px;color:var(--muted);margin-top:2px}
.map-wrap{border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);margin-top:10px}
.no-map{background:var(--surface2);height:120px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);border-radius:var(--radius-sm)}
.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.special-state{text-align:center;padding:60px 20px}
.special-state h2{font-size:18px;margin-bottom:8px}
.special-state p{font-size:13px;color:var(--muted);line-height:1.6}
.refresh-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all .15s;margin-bottom:12px}
.refresh-btn:hover{background:var(--surface2)}
.footer{text-align:center;font-size:12px;color:var(--muted);margin-top:20px;padding-bottom:32px;line-height:1.8}
</style>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<div class="topbar">
  <div class="logo"><div class="logo-dot"></div>Pixel Solusindo</div>
  <span class="track-label">Tracking Tiket</span>
</div>
<div class="main">
  <div id="loading" class="loading"><div class="spinner"></div>Memuat status tiket...</div>
  <div id="content" style="display:none"></div>
  <div id="expired" class="special-state" style="display:none">
    <div style="font-size:52px;margin-bottom:16px">⏰</div>
    <h2>Link Kedaluwarsa</h2>
    <p>Link tracking ini sudah tidak aktif.<br>Masa aktif adalah <strong>14 hari</strong> sejak tiket dibuat.<br><br>Hubungi kami untuk informasi lebih lanjut.</p>
    <div style="margin-top:20px"><a href="https://wa.me/6287734772999" style="display:inline-block;background:var(--accent);color:#fff;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:500;text-decoration:none">📲 Hubungi Kami</a></div>
  </div>
  <div id="error" class="special-state" style="display:none">
    <div style="font-size:52px;margin-bottom:16px">🔍</div>
    <h2>Tiket Tidak Ditemukan</h2>
    <p>Link tracking tidak valid atau tiket sudah dihapus.</p>
  </div>
</div>
<script>
const token=location.pathname.split('/track/')[1];
const STATUS={assigned:{label:'Assigned',icon:'👷',cls:'progress'},done:{label:'Selesai',icon:'✅',cls:'done'},travelling:{label:'Dalam Perjalanan',icon:'🚗',cls:'progress'},ongoing:{label:'Sedang Dikerjakan',icon:'🔧',cls:'done'},pending:{label:'Menunggu',icon:'⏳',cls:'pending'}};
const fmt=iso=>iso?new Date(iso).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
const fmtDate=iso=>iso?new Date(iso).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}):'-';
const mapsLink=(lat,lng)=>`https://www.google.com/maps?q=${lat},${lng}`;
function waLinkT(phone){
  if(!phone) return '';
  const clean=phone.replace(/[^0-9]/g,'').replace(/^0/,'62');
  return ` <a href="https://wa.me/${clean}" target="_blank" style="color:#0F6E56;font-weight:600;font-size:12px;margin-left:4px">📲 WA</a>`;
}
function gpsLinkT(lat,lng){
  return `<a href="${mapsLink(lat,lng)}" target="_blank" style="color:#185FA5;font-size:12px">📍 Lihat di Maps</a>`;
}

async function load(){
  try{
    const r=await fetch('/api/track/'+token);
    if(r.status===410){document.getElementById('loading').style.display='none';document.getElementById('expired').style.display='block';return;}
    if(!r.ok) throw new Error();
    render(await r.json());
  }catch(e){document.getElementById('loading').style.display='none';document.getElementById('error').style.display='block';}
}

function render(t){
  window.currentTicketData=t; // simpan untuk keperluan generate PDF
  document.getElementById('loading').style.display='none';
  const st=STATUS[t.status]||STATUS.pending;
  const hasGPS=t.last_lat&&t.last_lng;
  const expiry=new Date(t.expires_at);
  const daysLeft=Math.max(0,Math.ceil((expiry-new Date())/864e5));

  const histHTML=(t.status_history||[]).slice().reverse().map(h=>{
    const s=STATUS[h.status]||STATUS.pending;
    return`<div class="tl-item">
      <div class="tl-dot ${s.cls}">${s.icon}</div>
      <div class="tl-body">
        <div class="tl-status">${s.label}</div>
        <div class="tl-meta">${h.technician||''} &nbsp;·&nbsp; ${fmt(h.timestamp)}
          ${h.lat&&h.lng?'<br>'+gpsLinkT(h.lat,h.lng):''}
        </div>
      </div>
    </div>`;
  }).join('');

  // job stages
  const stageMap={berangkat:{icon:'🚗',label:'Teknisi Berangkat',cls:'progress'},tiba:{icon:'📍',label:'Teknisi Tiba di Lokasi',cls:'done'}};
  const stagesHTML=(t.job_stages||[]).map(s=>{
    const sm=stageMap[s.stage]||{icon:'🔹',label:s.stage,cls:'pending'};
    return`<div class="tl-item">
      <div class="tl-dot ${sm.cls}">${sm.icon}</div>
      <div class="tl-body">
        <div class="tl-status">${sm.label}</div>
        <div class="tl-meta">${fmt(s.timestamp)}</div>
      </div>
    </div>`;
  }).join('');

  const invoices=t.invoices||[];
  const invoiceHTML=invoices.length
    ?invoices.map(inv=>{
        const isPDF=inv.mime_type==='application/pdf'||inv.original_name?.endsWith('.pdf');
        if(inv.file_deleted){
          return`<div class="invoice-item" style="opacity:.5;cursor:default">
            <div class="inv-icon">🗑️</div>
            <div class="inv-body"><div class="inv-name">${inv.original_name}</div>
            <div class="inv-meta" style="color:#A32D2D">File Sudah Melewati Batas 14 Hari, silahkan kontak Akunting untuk file yang Anda butuhkan</div></div>
          </div>`;
        }
        return`<a class="invoice-item" href="${inv.file_url}" target="_blank">
          <div class="inv-icon">${isPDF?'📑':'🖼️'}</div>
          <div class="inv-body">
            <div class="inv-name">${inv.original_name}</div>
            <div class="inv-meta">${inv.note||'Invoice'} · ${fmt(inv.uploaded_at)}</div>
          </div>
          <div style="color:var(--muted);font-size:18px">›</div>
        </a>`;
      }).join('')
    :'<div style="font-size:13px;color:var(--muted);padding:8px 0">Belum ada invoice tersedia.</div>';

  const mapHTML=hasGPS
    ?`<div class="map-wrap"><iframe width="100%" height="180" style="border:none" loading="lazy" src="https://maps.google.com/maps?q=${t.last_lat},${t.last_lng}&z=15&output=embed"></iframe></div>
      <p style="font-size:11px;color:var(--muted);margin-top:6px;text-align:center">Lokasi terakhir · ${fmt(t.last_gps_at)} &nbsp;·&nbsp; <a href="${mapsLink(t.last_lat,t.last_lng)}" target="_blank" style="color:var(--blue)">Buka Google Maps ›</a></p>`
    :'<div class="no-map">📍 Lokasi belum tersedia</div>';

  document.getElementById('content').innerHTML=`
    <div class="status-hero">
      <div class="status-icon">${st.icon}</div>
      <span class="badge ${st.cls}">${st.label}</span>
      <div class="status-label">Pekerjaan ${st.label}</div>
      ${t.project_name?`<div style="font-size:13px;color:var(--muted);margin-top:6px">📁 ${t.project_name}</div>`:''}
      <div class="wo-number">Nomor WO: ${t.wo_number}</div>
      <div class="expiry-pill">⏳ Link aktif ${daysLeft} hari lagi · s/d ${fmtDate(t.expires_at)}</div>
    </div>
    <div class="card">
      <div class="card-title">Informasi Pekerjaan</div>
      ${t.customer_name?`<div class="info-row"><span class="info-label">Customer</span><span class="info-value">${t.customer_name}${t.customer_phone?waLinkT(t.customer_phone):''}</span></div>`:''}
      ${t.project_name?`<div class="info-row"><span class="info-label">Project</span><span class="info-value">${t.project_name}</span></div>`:''}
      <div class="info-row"><span class="info-label">Tim Teknisi</span><span class="info-value">${
        Array.isArray(t.technicians)&&t.technicians.length>1
          ? t.technicians.join(' & ')
          : t.technician||'-'
      }</span></div>
      <div class="info-row"><span class="info-label">Waktu Pekerjaan</span><span class="info-value">${fmt(t.worked_at)}</span></div>
      ${t.description?`<div class="info-row"><span class="info-label">Keterangan</span><span class="info-value">${t.description}</span></div>`:''}
    </div>
    <div class="card"><div class="card-title">📍 Lokasi Terakhir Teknisi</div>${mapHTML}</div>
    <div class="card"><div class="card-title">📄 Invoice & Dokumen</div>${invoiceHTML}
      <div style="text-align:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
        <a href="javascript:void(0)" onclick="downloadTrackPDF()" style="display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:13px;text-decoration:none">
          📋 Lihat Laporan PDF Pekerjaan
        </a>
      </div>
    </div>
    <div class="card"><div class="card-title">🕐 Riwayat Status</div><div>${histHTML||'<p style="font-size:13px;color:var(--muted)">Belum ada riwayat.</p>'}</div></div>
    ${stagesHTML?`<div class="card"><div class="card-title">🗺️ Pergerakan Teknisi</div><div>${stagesHTML}</div></div>`:''}
    <button class="refresh-btn" onclick="location.reload()">🔄 Perbarui status</button>
    <div class="footer">Layanan oleh <strong style="color:var(--accent)">Pixel Solusindo</strong><br>
      <a href="https://wa.me/6287734772999" style="color:var(--accent)">📲 0877-3477-2999</a>
    </div>`;
  document.getElementById('content').style.display='block';
}

function downloadTrackPDF(){
  const t=window.currentTicketData;
  if(!t){ alert('Data belum siap, coba lagi sesaat.'); return; }

  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const PW=210, PH=297, ML=18, MR=18, CW=PW-ML-MR;
  const sl={assigned:'Assigned',done:'Selesai',travelling:'Dalam Perjalanan',ongoing:'Sedang Dikerjakan',pending:'Menunggu'};
  const statusColor={assigned:[60,52,137],done:[59,109,17],travelling:[24,95,165],ongoing:[15,110,86],pending:[133,79,11]};
  const today=new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
  const fmtDT=iso=>iso?new Date(iso).toLocaleString('id-ID',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-';

  let y=18;
  function checkPageBreak(neededHeight){
    if(y+neededHeight>PH-16){ doc.addPage(); y=18; return true; }
    return false;
  }

  // ── Header ──
  doc.setFillColor(224,123,57);
  doc.rect(0,0,PW,16,'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(13);
  doc.setTextColor(255,255,255);
  doc.text('LAPORAN PEKERJAAN — PIXEL SOLUSINDO',ML,10.5);

  y+=6;
  doc.setFont('helvetica','bold');
  doc.setFontSize(15);
  doc.setTextColor(26,25,22);
  doc.text(t.wo_number||'-',ML,y);
  const stColor=statusColor[t.status]||[122,118,112];
  const stLabel=sl[t.status]||t.status;
  doc.setFillColor(...stColor);
  const badgeW=doc.getTextWidth(stLabel)+10;
  doc.roundedRect(PW-MR-badgeW,y-5,badgeW,7,3,3,'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(8);
  doc.setTextColor(255,255,255);
  doc.text(stLabel,PW-MR-badgeW/2,y-0.5,{align:'center'});
  y+=3;
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(122,118,112);
  doc.text('Dicetak: '+today,ML,y+3);
  y+=10;

  // ── Info section ──
  const infoRows=[
    ['Teknisi',       Array.isArray(t.technicians)&&t.technicians.length?t.technicians.join(' & '):(t.technician||'-')],
    ['Nama Project',  t.project_name||'-'],
    ['Nama Customer', t.customer_name||'-'],
    ['No. WA Customer',t.customer_phone||'-'],
    ['Tanggal Kerja', fmtDT(t.worked_at)],
  ];
  const colW=CW/2-4;
  const infoRowGap=17;
  const lineH=3.6;
  const infoLinesArr=infoRows.map(row=>{
    if(row[0]==='No. WA Customer') return 1;
    return doc.splitTextToSize(row[1],colW-8).slice(0,2);
  });
  infoRows.forEach((row,i)=>{
    const col=i%2, rowIdx=Math.floor(i/2);
    const x=ML+(col*(colW+8));
    const iy=y+(rowIdx*infoRowGap);
    const cellLines=Array.isArray(infoLinesArr[i])?infoLinesArr[i]:[row[1]];
    const cellRowH=cellLines.length>1?(infoRowGap-2):13;
    doc.setFillColor(col%2===0?250:247,col%2===0?249:248,col%2===0?247:245);
    doc.setDrawColor(226,222,214);
    doc.roundedRect(x,iy,colW,cellRowH,2,2,'FD');
    doc.setFont('helvetica','normal');
    doc.setFontSize(7);
    doc.setTextColor(122,118,112);
    doc.text(row[0].toUpperCase(),x+4,iy+4.5);
    doc.setFont('helvetica','bold');
    doc.setFontSize(8.5);
    if(row[0]==='No. WA Customer'&&row[1]!=='-'){
      const clean=row[1].replace(/\D/g,'').replace(/^0/,'62');
      doc.setTextColor(15,110,86);
      const waText='WA: '+row[1];
      doc.text(waText,x+4,iy+10);
      doc.link(x+4,iy+7,doc.getTextWidth(waText),4,{url:'https://wa.me/'+clean});
    } else {
      doc.setTextColor(26,25,22);
      cellLines.forEach((line,li)=>{ doc.text(line,x+4,iy+9+(li*lineH)); });
    }
  });
  y+=Math.ceil(infoRows.length/2)*infoRowGap+4;

  if(t.last_lat&&t.last_lng){
    const gpsUrl=`https://maps.google.com/?q=${t.last_lat},${t.last_lng}`;
    doc.setFont('helvetica','normal');
    doc.setFontSize(7.5);
    doc.setTextColor(24,95,165);
    const gpsText=`Lokasi GPS Terakhir: ${parseFloat(t.last_lat).toFixed(6)}, ${parseFloat(t.last_lng).toFixed(6)} (klik untuk buka Maps)`;
    doc.text(gpsText,ML,y);
    doc.link(ML,y-4,doc.getTextWidth(gpsText),5,{url:gpsUrl});
    doc.setTextColor(26,25,22);
    y+=6;
  }

  // ── Deskripsi ──
  checkPageBreak(28);
  doc.setFont('helvetica','bold');
  doc.setFontSize(8.5);
  doc.setTextColor(26,25,22);
  doc.text('DESKRIPSI PEKERJAAN',ML,y);
  y+=3.5;
  doc.setDrawColor(224,123,57);
  doc.setLineWidth(0.5);
  doc.line(ML,y,ML+CW,y);
  y+=4;
  doc.setFont('helvetica','normal');
  doc.setFontSize(8.5);
  doc.setTextColor(26,25,22);
  const desc=t.description||'(tidak ada deskripsi)';
  const descLines=doc.splitTextToSize(desc,CW);
  doc.setFillColor(250,249,247);
  doc.setDrawColor(226,222,214);
  const descH=Math.max(descLines.length*4.5+6,16);
  checkPageBreak(descH+8);
  doc.roundedRect(ML,y,CW,descH,2,2,'FD');
  doc.text(descLines,ML+4,y+5.5);
  y+=descH+6;

  // ── TTD section ──
  checkPageBreak(48);
  const ttdY=y+3;
  const ttdBoxH=40;
  doc.setFont('helvetica','normal');
  doc.setFontSize(7.5);
  doc.setTextColor(122,118,112);
  doc.setDrawColor(200,196,190);
  doc.setLineWidth(0.3);

  const halfW=(CW-8)/2;
  doc.rect(ML,ttdY,halfW,ttdBoxH,'S');
  doc.text('Teknisi Pelaksana',ML+4,ttdY+5);
  const techNames=Array.isArray(t.technicians)&&t.technicians.length
    ? t.technicians.join(' & ') : (t.technician||'-');
  if(t.tech_signature&&t.tech_signature.startsWith('data:')){
    try{ doc.addImage(t.tech_signature,'PNG',ML+4,ttdY+7,halfW-8,18); }catch(e){}
  }
  doc.setFontSize(7);
  doc.setTextColor(26,25,22);
  doc.splitTextToSize(techNames,halfW-8).slice(0,2).forEach((line,li)=>{
    doc.text(line,ML+4,ttdY+30+(li*3.4));
  });

  doc.setFontSize(7.5);
  doc.setTextColor(122,118,112);
  doc.rect(ML+halfW+8,ttdY,halfW,ttdBoxH,'S');
  doc.text('Customer / Penerima',ML+halfW+12,ttdY+5);
  if(t.customer_signature&&t.customer_signature.startsWith('data:')){
    try{ doc.addImage(t.customer_signature,'PNG',ML+halfW+12,ttdY+7,halfW-8,18); }catch(e){}
  }
  if(t.customer_name){
    doc.setFontSize(7);
    doc.setTextColor(26,25,22);
    doc.splitTextToSize(t.customer_name,halfW-8).slice(0,2).forEach((line,li)=>{
      doc.text(line,ML+halfW+12,ttdY+30+(li*3.4));
    });
  }
  y=ttdY+ttdBoxH+8;

  // ── Tahapan Pekerjaan ──
  const stages=t.job_stages||[];
  if(stages.length){
    checkPageBreak(18);
    doc.setFont('helvetica','bold');
    doc.setFontSize(8.5);
    doc.setTextColor(26,25,22);
    doc.text('TAHAPAN PEKERJAAN',ML,y);
    y+=3.5;
    doc.setDrawColor(224,123,57);
    doc.setLineWidth(0.5);
    doc.line(ML,y,ML+CW,y);
    y+=4;
    const stageLabel={berangkat:'Berangkat',tiba:'Tiba di Lokasi'};
    const stageColor={berangkat:[24,95,165],tiba:[59,109,17]};
    stages.forEach((s,i)=>{
      checkPageBreak(16);
      const col=stageColor[s.stage]||[122,118,112];
      const timeStr=new Date(s.timestamp).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'});
      doc.setFillColor(...col);
      doc.circle(ML+3,y+2,1.8,'F');
      if(i<stages.length-1){
        doc.setDrawColor(...col);
        doc.setLineWidth(0.5);
        doc.line(ML+3,y+3.8,ML+3,y+11.5);
      }
      doc.setFont('helvetica','bold');
      doc.setFontSize(8);
      doc.setTextColor(...col);
      doc.text(stageLabel[s.stage]||s.stage,ML+8,y+3);
      doc.setFont('helvetica','normal');
      doc.setFontSize(7);
      doc.setTextColor(122,118,112);
      doc.text(timeStr,ML+8,y+7.5);
      y+=11.5;
    });
    y+=3;
  }

  // ── Riwayat Status ──
  const hist=t.status_history||[];
  if(hist.length){
    checkPageBreak(18);
    doc.setFont('helvetica','bold');
    doc.setFontSize(8.5);
    doc.setTextColor(26,25,22);
    doc.text('RIWAYAT STATUS',ML,y);
    y+=3.5;
    doc.setDrawColor(224,123,57);
    doc.setLineWidth(0.5);
    doc.line(ML,y,ML+CW,y);
    y+=4;
    doc.autoTable({
      head:[['Waktu','Status','Teknisi']],
      body:[...hist].reverse().map(h=>[fmtDT(h.timestamp), sl[h.status]||h.status, h.technician||'-']),
      startY:y,
      margin:{left:ML,right:MR},
      styles:{fontSize:7.5,cellPadding:2,valign:'middle'},
      headStyles:{fillColor:[240,238,233],textColor:[26,25,22],fontStyle:'bold',fontSize:7.5},
      columnStyles:{0:{cellWidth:48},1:{cellWidth:28,halign:'center'},2:{cellWidth:CW-48-28}},
      didParseCell(d){
        if(d.section==='body'&&d.column.index===1){
          const status=([...hist].reverse()[d.row.index]||{}).status;
          if(status) d.cell.styles.textColor=statusColor[status]||[26,25,22];
          d.cell.styles.fontStyle='bold';
        }
        if(d.section==='body'&&d.row.index%2!==0) d.cell.styles.fillColor=[250,249,247];
      },
    });
    y=doc.lastAutoTable.finalY+6;
  }

  // ── Footer ──
  const totalPages=doc.getNumberOfPages();
  for(let pg=1;pg<=totalPages;pg++){
    doc.setPage(pg);
    doc.setFillColor(224,123,57);
    doc.rect(0,PH-10,PW,10,'F');
    doc.setFont('helvetica','normal');
    doc.setFontSize(7);
    doc.setTextColor(255,255,255);
    doc.text(`WO: ${t.wo_number||'-'}  |  Pixel Solusindo  |  0877-3477-2999  |  Hal ${pg}/${totalPages}`,PW/2,PH-4,{align:'center'});
  }

  doc.save(`laporan_${(t.wo_number||'tiket').replace(/[^a-zA-Z0-9]/g,'_')}.pdf`);
}

load();
setInterval(load,30000);
</script>
</body>
</html>
