<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracking Tiket — Pixel Solusindo</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--text:#282725;--muted:#7e7a74;--line:#e5e0d7;--orange:#e47b36;--green:#23845b;--blue:#246a9b;--radius:22px}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.brand{font-size:19px;font-weight:800}.brand:before{content:'●';color:var(--orange);margin-right:10px}.pill{border:1px solid var(--line);border-radius:99px;padding:8px 15px;color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.06em}.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:0 8px 24px rgba(50,40,25,.04)}.hero{text-align:center;padding:36px 24px}.hero-icon{font-size:68px}.status{display:inline-block;background:#e8f3fb;color:var(--blue);padding:8px 18px;border-radius:99px;font-weight:800;margin:8px 0}.hero h1{font-size:30px;margin:12px 0 8px}.hero .project{color:var(--muted);font-size:17px}.wo{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-family:ui-monospace,monospace}.expiry{display:inline-block;margin-top:12px;background:#fff2df;color:#8b5b23;padding:6px 12px;border-radius:99px;font-size:13px}.section-title{font-size:16px;color:#706d68;letter-spacing:.05em;font-weight:800;margin:0 0 18px}.row{display:grid;grid-template-columns:160px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row span:first-child{color:var(--muted)}.row span:last-child{text-align:right;font-weight:600}.timeline{display:grid;gap:12px}.stage{display:flex;gap:12px;align-items:flex-start}.stage-dot{width:12px;height:12px;border-radius:50%;background:var(--orange);margin-top:5px}.stage b{display:block}.stage small{color:var(--muted)}.file{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:14px;margin-top:10px}.file a{color:var(--blue);font-weight:700;text-decoration:none}.signature-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.signature{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;min-height:130px}.signature img{max-width:100%;max-height:80px}.signature small{display:block;color:var(--muted);margin-top:8px}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.photo{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.photo-info{padding:10px;font-size:12px}.photo-info b{display:block;margin-bottom:4px}.photo-info small{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:22px;border:1px dashed var(--line);border-radius:14px}.error{color:#b33;background:#fff0f0;border:1px solid #ffcaca;padding:14px;border-radius:12px}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.lightbox.show{display:flex}.lightbox img{max-width:95vw;max-height:90vh;border-radius:12px}.lightbox button{position:absolute;right:18px;top:18px;width:42px;height:42px;border:0;border-radius:50%;font-size:22px}@media(max-width:620px){header{padding:0 18px}.wrap{padding:18px 12px 45px}.card{padding:20px}.hero h1{font-size:27px}.row{grid-template-columns:115px 1fr;font-size:14px}.signature-grid{grid-template-columns:1fr}.photos{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="brand">Pixel Solusindo</div><div class="pill">TRACKING TIKET</div></header><main class="wrap" id="app"><div class="card"><div class="empty">Memuat data pekerjaan...</div></div></main>
<div class="lightbox" id="lightbox" onclick="closeLightbox()"><button>×</button><img id="lightbox-img" alt="Dokumentasi pekerjaan"></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const token=location.pathname.split('/').filter(Boolean).pop();
const statusMap={assigned:['Assigned','Pekerjaan Assigned','👷'],travelling:['Dalam Perjalanan','Teknisi Dalam Perjalanan','🚗'],ongoing:['Sedang Dikerjakan','Pekerjaan Sedang Dikerjakan','🛠️'],done:['Selesai','Pekerjaan Selesai','✅'],pending:['Menunggu','Pekerjaan Menunggu','⏳']};
const dt=v=>v?new Date(v).toLocaleString('id-ID',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
function openLightbox(url){document.getElementById('lightbox-img').src=url;document.getElementById('lightbox').classList.add('show')}function closeLightbox(){document.getElementById('lightbox').classList.remove('show')}
async function load(){try{const r=await fetch('/api/track/'+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw new Error(d.error||'Data tidak dapat dimuat');render(d)}catch(e){document.getElementById('app').innerHTML=`<div class="card"><div class="error">${esc(e.message)}</div></div>`}}
function render(d){const st=statusMap[d.status]||[d.status||'-','Status Pekerjaan','📋'];const inv=(d.invoices||[]);const photos=d.photos||[];const expiry=d.expires_at?new Date(d.expires_at):null;const days=expiry?Math.max(0,Math.ceil((expiry-new Date())/864e5)):0;
document.getElementById('app').innerHTML=`
<section class="card hero"><div class="hero-icon">${st[2]}</div><div class="status">${esc(st[0])}</div><h1>${esc(st[1])}</h1><div class="project">📁 ${esc(d.project_name||'-')}</div><div class="wo">Nomor WO: ${esc(d.wo_number||'-')}</div>${expiry?`<div class="expiry">⌛ Link aktif ${days} hari lagi · s/d ${expiry.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})}</div>`:''}</section>
<section class="card"><h2 class="section-title">INFORMASI PEKERJAAN</h2><div class="row"><span>Customer</span><span>${esc(d.customer_name||'-')}</span></div><div class="row"><span>Project</span><span>${esc(d.project_name||'-')}</span></div><div class="row"><span>Tim Teknisi</span><span>${esc((d.technicians||[]).join(' & ')||d.technician||'-')}</span></div><div class="row"><span>Waktu Pekerjaan</span><span>${dt(d.worked_at)}</span></div><div class="row"><span>Keterangan</span><span>${esc(d.description||'-')}</span></div></section>
<section class="card"><h2 class="section-title">PROGRESS PEKERJAAN</h2><div class="timeline">${(d.job_stages||[]).length?(d.job_stages||[]).map(x=>`<div class="stage"><div class="stage-dot"></div><div><b>${esc(x.stage||'-')}</b><small>${esc(x.technician||'-')} · ${dt(x.timestamp)}</small></div></div>`).join(''):'<div class="empty">Belum ada progress pekerjaan.</div>'}</div></section>
<section class="card"><h2 class="section-title">INVOICE</h2>${inv.length?inv.map(x=>`<div class="file"><div><b>${esc(x.original_name||'Invoice')}</b><br><small>${x.total_amount?'Rp '+Number(x.total_amount).toLocaleString('id-ID'):''}</small></div>${x.file_url&&!x.file_deleted?`<a href="${x.file_url}" target="_blank">Lihat Invoice</a>`:'<span style="color:var(--muted)">File tidak tersedia</span>'}</div>`).join(''):'<div class="empty">Invoice belum tersedia.</div>'}</section>
<section class="card"><h2 class="section-title">BAST</h2><div class="signature-grid"><div class="signature">${d.tech_signature?`<img src="${d.tech_signature}" alt="Tanda tangan teknisi">`:'<div class="empty">Belum ditandatangani</div>'}<small>Teknisi</small></div><div class="signature">${d.customer_signature?`<img src="${d.customer_signature}" alt="Tanda tangan customer">`:'<div class="empty">Belum ditandatangani</div>'}<small>Customer</small></div></div></section>
<section class="card"><h2 class="section-title">📷 DOKUMENTASI PEKERJAAN</h2>${photos.length?`<div class="photos">${photos.map(x=>`<div class="photo"><img src="${x.secure_url||x.image_url}" alt="Foto pekerjaan" onclick="openLightbox('${x.secure_url||x.image_url}')"><div class="photo-info"><b>${esc(x.caption||'Dokumentasi pekerjaan')}</b><small>${esc(x.uploaded_by||'Teknisi')} · ${dt(x.uploaded_at||x.created_at)}</small></div></div>`).join('')}</div>`:'<div class="empty">Belum ada dokumentasi pekerjaan.</div>'}</section>`}
load();
</script></body></html>
