<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelApps · Kanban Teknisi</title><style>body{font-family:Arial,sans-serif;background:#f7f6f3;color:#1a1916;margin:0}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:14px 16px;display:flex;gap:10px;align-items:center;z-index:5}.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer}.btn.active{font-weight:700;background:#f3eee6;border-color:#d5c5b0}.wrap{padding:16px}.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.head h2{margin-right:auto}.modes{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px}.day{min-width:290px;max-width:330px;background:#f3f2ef;border:1px solid #ddd8cf;border-radius:10px;padding:10px}.card{background:#fff;border:1px solid #dedad2;border-radius:8px;padding:9px;margin-bottom:7px}.meta{font-size:12px;color:#6f6b64;margin-top:3px}.free{font-size:12px;color:#3b6d11;margin:6px 0 8px}.warn{color:#a32d2d}.off{color:#a32d2d;font-weight:700;margin-top:4px}.off-tag{display:inline-block;margin:4px 0;padding:2px 6px;border-radius:999px;background:#fce8e6;color:#a32d2d;font-size:9px;font-weight:800}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}.modal.show{display:flex}.dialog{width:min(420px,100%);background:#fff;border-radius:14px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;margin-bottom:5px}.field input,.modes select,.modes input{box-sizing:border-box;padding:9px;border:1px solid #ddd;border-radius:8px;background:#fff}.field input{width:100%}.timeline-wrap{overflow:auto;border:1px solid #ddd8cf;border-radius:10px;background:#fff}.timeline-grid{min-width:1050px}.tl-head,.tl-row{display:grid;grid-template-columns:210px 1fr;border-bottom:1px solid #eee}.tl-label{padding:10px;border-right:1px solid #eee;font-weight:600;background:#faf9f6;position:sticky;left:0;z-index:2}.tl-label.off-row{background:#fff0ef;color:#a32d2d}.tl-hours{position:relative;height:38px;background:repeating-linear-gradient(to right,#fafafa 0,#fafafa calc(4.166% - 1px),#ddd 4.166%)}.tl-hour{position:absolute;top:9px;font-size:10px;transform:translateX(-50%)}.tl-track{position:relative;min-height:60px;background:repeating-linear-gradient(to right,#fff 0,#fff calc(4.166% - 1px),#eee 4.166%)}.tl-bar{position:absolute;top:9px;height:42px;border-radius:7px;padding:6px 8px;box-sizing:border-box;overflow:visible;background:#eee8dc;border:1px solid #d0c5b3;font-size:11px;touch-action:none;cursor:grab;min-width:132px}.tl-bar.dragging{opacity:.65;cursor:grabbing}.tl-bar b{display:block;white-space:nowrap}.tl-bar span{display:block;font-size:10px;margin-top:2px;white-space:nowrap}.week-grid{display:grid;grid-template-columns:170px repeat(7,minmax(120px,1fr));min-width:1010px}.week-cell{padding:8px;border-right:1px solid #eee;border-bottom:1px solid #eee;min-height:66px}.week-cell.head{font-weight:700;background:#faf9f6;position:sticky;top:0}.week-cell.off-cell{background:repeating-linear-gradient(135deg,#fff5f4,#fff5f4 7px,#fce8e6 7px,#fce8e6 14px)}.week-chip{display:block;border:1px solid #d0c5b3;background:#eee8dc;border-radius:6px;padding:5px;margin-bottom:5px;font-size:10px;touch-action:none}.today-mark{outline:3px solid #e67e22;outline-offset:-3px;background:rgba(230,126,34,.06)}@media(max-width:600px){.day{min-width:86vw}.grid{grid-template-columns:1fr}.modes{width:100%}.modes input,.modes select{max-width:145px}}</style></head><body><div class="top"><button class="btn" onclick="backToApp()">← Kembali</button><b>🗓️ Kanban Teknisi</b></div><div class="wrap"><div class="head"><h2>Kanban & Jadwal Teknisi</h2><button class="btn" onclick="mv(-7)">‹ Minggu</button><button class="btn" onclick="today()">Hari Ini</button><button class="btn" onclick="mv(7)">Minggu ›</button></div><div class="modes"><button id="modeKanban" class="btn active" onclick="setMode('kanban')">Kanban</button><button id="modeTimeline" class="btn" onclick="setMode('timeline')">Timeline</button><select id="scale" style="display:none" onchange="setScale(this.value)"><option value="day">Harian</option><option value="week">Mingguan</option></select><input id="timelineDate" type="date" style="display:none" onchange="loadTimelineDay()"></div><div id="range" class="meta" style="margin-bottom:10px"></div><div id="body">Memuat...</div></div><div id="modal" class="modal"><div class="dialog"><h3>Edit Jadwal WO</h3><div class="grid"><div class="field"><label>Tanggal kerja</label><input type="date" id="date"></div><div class="field"><label>Jam mulai</label><input type="time" id="time"></div></div><div class="field"><label>Estimasi durasi (menit)</label><input type="number" id="dur" min="1" max="1440"></div><div id="err" class="warn"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" onclick="closeM()">Batal</button><button class="btn" onclick="saveM()">Simpan</button></div></div></div><script>
function backToApp(){try{if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin){history.back();return}}catch(_){}location.replace('/')}
const T=()=>localStorage.getItem('pixel_token')||sessionStorage.getItem('pixel_token')||localStorage.getItem('token')||localStorage.getItem('authToken')||localStorage.getItem('pxl_token')||'';
const H=()=>{const t=T(),h={'Content-Type':'application/json'};if(t){h.Authorization='Bearer '+t;h['X-Auth-Token']=t}return h};
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),mon=d=>{const x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);x.setHours(0,0,0,0);return x},add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=v=>String(v??'').trim().toLowerCase();
let week=mon(new Date()),tickets=[],techs=[],leaves=[],canEdit=false,editing=null,mode='kanban',scale='day';
async function api(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt,headers:{...H(),...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.message||('HTTP '+r.status));return d}
function techName(x){return typeof x==='object'?(x.name||x.username||x.id):x}
function techKeys(x){return[x?.id,x?.user_id,x?.name,x?.username].filter(Boolean).map(norm)}
function leaveFor(tech,date){const keys=new Set(techKeys(tech));return leaves.find(l=>String(l.start_date||'').slice(0,10)<=date&&String(l.end_date||'').slice(0,10)>=date&&[l.user_id,l.technician].filter(Boolean).map(norm).some(v=>keys.has(v)))}
function ticketAssignments(t){const out=[];(Array.isArray(t.technicians)?t.technicians:[]).forEach(x=>out.push(...(typeof x==='object'?[x.id,x.name,x.username,x.user_id,x.technician_id]:[x]).filter(Boolean).map(norm)));[t.technician,t.technician_id,t.assigned_to,t.assigned_to_id].forEach(x=>{if(x)out.push(norm(x))});return new Set(out)}
function endTime(t){if(!t.scheduled_start_time)return'-';const[h,m]=t.scheduled_start_time.split(':').map(Number),v=h*60+m+Number(t.estimated_duration_minutes||60);return pad(Math.floor(v/60)%24)+':'+pad(v%60)}
function mins(v){const[h,m]=String(v||'08:00').slice(0,5).split(':').map(Number);return(Number.isFinite(h)?h:8)*60+(Number.isFinite(m)?m:0)}
function hhmm(v){v=Math.max(0,Math.min(1439,Math.round(v/15)*15));return pad(Math.floor(v/60))+':'+pad(v%60)}
async function load(){const end=add(week,6);range.textContent=week.toLocaleDateString('id-ID')+' – '+end.toLocaleDateString('id-ID');body.textContent='Memuat...';try{const d=await api('/api/technician-kanban?date_from='+ymd(week)+'&date_to='+ymd(end));tickets=d.tickets||[];techs=d.technicians||[];leaves=d.technician_leaves||[];canEdit=!!d.can_edit;if(mode==='timeline'){if(scale==='week')renderWeek();else await loadTimelineDay()}else renderKanban()}catch(e){body.innerHTML='<div class="warn">'+esc(e.message)+'</div>'}}
function renderKanban(){const days=[...Array(7)].map((_,i)=>add(week,i));body.innerHTML='<div class="board">'+days.map(d=>{const date=ymd(d),rows=tickets.filter(t=>t.scheduled_date===date),off=techs.filter(t=>leaveFor(t,date)),available=techs.filter(t=>!leaveFor(t,date)),used=new Set();rows.forEach(t=>(t.technicians||[]).forEach(x=>{if(typeof x==='object'){[x.id,x.name,x.username].filter(Boolean).forEach(v=>used.add(norm(v)))}else used.add(norm(x))}));const usedAvail=available.filter(t=>techKeys(t).some(k=>used.has(k))),free=available.filter(t=>!techKeys(t).some(k=>used.has(k)));return '<div class="day '+(date===ymd(new Date())?'today-mark':'')+'"><h3>'+d.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'short'})+'</h3><div class="meta">'+rows.length+' WO · Terisi '+usedAvail.length+'/'+available.length+' · Sisa '+free.length+' · Off '+off.length+'</div><div class="free">'+(free.length?'Kosong: '+free.map(x=>esc(x.name)).join(', '):'Tidak ada teknisi kosong')+(off.length?'<div class="off">OFF/Cuti: '+off.map(x=>esc(x.name)).join(', ')+'</div>':'')+'</div>'+rows.sort((a,b)=>String(a.scheduled_start_time||'').localeCompare(String(b.scheduled_start_time||''))).map(t=>'<div class="card"><b>'+esc(t.wo_number||'-')+'</b><div>'+esc(t.project_name||t.customer_name||'-')+'</div><div class="meta">'+esc(t.customer_name||'-')+' · '+esc((t.technicians||[]).map(techName).join(', ')||'Belum ada teknisi')+'</div><div class="meta">🕒 '+esc(t.scheduled_start_time||'-')+'–'+esc(endTime(t))+' · '+esc(t.estimated_duration_minutes||60)+' menit</div><div class="meta">Status: '+esc(t.status||'-')+'</div>'+((t.leave_conflicts||[]).length?'<div class="off">⚠ '+esc((t.leave_conflicts||[]).map(x=>x.technician).join(', '))+' sedang cuti</div>':'')+(canEdit?'<button class="btn" style="margin-top:7px" onclick="openM(\''+esc(t.id)+'\')">Edit Jadwal</button>':'')+'</div>').join('')+(rows.length?'':'<div class="meta">Belum ada WO.</div>')+'</div>'}).join('')+'</div>'}
function setMode(v){mode=v;modeKanban.classList.toggle('active',v==='kanban');modeTimeline.classList.toggle('active',v==='timeline');scaleEl().style.display=v==='timeline'?'block':'none';timelineDate.style.display=v==='timeline'&&scale==='day'?'block':'none';if(v==='timeline'){if(!timelineDate.value)timelineDate.value=ymd(new Date());if(scale==='week')renderWeek();else loadTimelineDay()}else renderKanban()}
function scaleEl(){return document.getElementById('scale')}
function setScale(v){scale=v;timelineDate.style.display=v==='day'?'block':'none';if(v==='week')renderWeek();else loadTimelineDay()}
async function loadTimelineDay(){const selected=timelineDate.value||ymd(new Date());try{const d=await api('/api/technician-kanban?date_from='+encodeURIComponent(selected)+'&date_to='+encodeURIComponent(selected));tickets=d.tickets||[];techs=d.technicians||techs;leaves=d.technician_leaves||leaves;canEdit=!!d.can_edit;renderDay(selected)}catch(e){body.innerHTML='<div class="warn">'+esc(e.message)+'</div>'}}
function renderDay(selected){const start=8*60,span=12*60,hours=[];for(let v=8*60;v<=20*60;v+=30){hours.push('<span class="tl-hour" style="left:'+((v-start)/span*100)+'%">'+pad(Math.floor(v/60))+':'+pad(v%60)+'</span>')}const uniq=[],seen=new Set();tickets.filter(t=>String(t.scheduled_date||'').slice(0,10)===selected).forEach((t,i)=>{const k=String(t.id||t.wo_number||i);if(!seen.has(k)){seen.add(k);uniq.push(t)}});const groups=techs.map(t=>({tech:t,name:t.name||t.username||String(t.id||'Teknisi'),jobs:[]})),unmapped=[];uniq.forEach(t=>{const a=ticketAssignments(t);const g=groups.find(g=>techKeys(g.tech).some(k=>a.has(k)));(g?g.jobs:unmapped).push(t)});const mkBars=jobs=>jobs.map((t,i)=>{const s=Math.max(start,Math.min(20*60-1,mins(t.scheduled_start_time))),dur=Math.max(30,Number(t.estimated_duration_minutes||60)),left=(s-start)/span*100,width=Math.max(4,Math.min(100-left,dur/span*100));return '<div class="tl-bar" data-id="'+esc(t.id||'')+'" style="left:'+left+'%;width:'+width+'%;top:'+(8+i*54)+'px" title="'+esc(t.wo_number||'WO')+' · '+esc(t.scheduled_start_time||'-')+'"><b>'+esc(t.wo_number||'WO')+'</b><span>'+esc(t.scheduled_start_time||'-')+' · '+esc(dur)+' menit</span></div>'}).join('');let rows=groups.map(g=>{const off=leaveFor(g.tech,selected),height=Math.max(60,g.jobs.length*54+12);return '<div class="tl-row"><div class="tl-label '+(off?'off-row':'')+'">'+esc(g.name)+(off?'<span class="off-tag">OFF / CUTI</span>':'')+'</div><div class="tl-track" style="min-height:'+height+'px">'+(g.jobs.length?mkBars(g.jobs):'<span class="meta" style="position:absolute;left:10px;top:20px">Kosong</span>')+'</div></div>'}).join('');if(unmapped.length){rows+='<div class="tl-row"><div class="tl-label">Belum Terpetakan</div><div class="tl-track" style="min-height:'+Math.max(66,unmapped.length*54+12)+'px">'+mkBars(unmapped)+'</div></div>'}body.innerHTML='<div class="timeline-wrap"><div class="timeline-grid"><div class="tl-head"><div class="tl-label">Teknisi</div><div class="tl-hours">'+hours.join('')+'</div></div>'+rows+'</div></div>';bindTimelineDrag(start,span)}
function renderWeek(){const days=[...Array(7)].map((_,i)=>add(week,i));let html='<div class="timeline-wrap"><div class="week-grid"><div class="week-cell head">Teknisi</div>'+days.map(d=>'<div class="week-cell head '+(ymd(d)===ymd(new Date())?'today-mark':'')+'">'+d.toLocaleDateString('id-ID',{weekday:'short',day:'2-digit'})+'</div>').join('');const rendered=new Set();for(const tech of techs){const name=tech.name||tech.id;html+='<div class="week-cell head">'+esc(name)+'</div>';for(const d of days){const date=ymd(d),jobs=tickets.filter(t=>t.scheduled_date===date&&(t.technicians||[]).some(x=>String(techName(x))===String(name)||String(typeof x==='object'?x.id:x)===String(tech.id)));jobs.forEach(t=>rendered.add(String(t.id)));const off=leaveFor(tech,date);html+='<div class="week-cell '+(date===ymd(new Date())?'today-mark ':'')+(off?'off-cell':'')+'" data-week-date="'+date+'">'+(off?'<span class="off-tag">OFF / CUTI</span>':'')+(jobs.map(t=>'<span class="week-chip" data-id="'+esc(t.id||'')+'">'+esc(t.scheduled_start_time||'-')+' '+esc(t.wo_number||'WO')+'</span>').join('')||'<span class="meta">Kosong</span>')+'</div>'}}const missing=tickets.filter(t=>days.some(d=>ymd(d)===t.scheduled_date)&&!rendered.has(String(t.id)));if(missing.length){html+='<div class="week-cell head">Belum Ditugaskan</div>';for(const d of days){const date=ymd(d),jobs=missing.filter(t=>t.scheduled_date===date);html+='<div class="week-cell" data-week-date="'+date+'">'+(jobs.map(t=>'<span class="week-chip" data-id="'+esc(t.id||'')+'">'+esc(t.scheduled_start_time||'-')+' '+esc(t.wo_number||'WO')+'</span>').join('')||'<span class="meta">Kosong</span>')+'</div>'}}body.innerHTML=html+'</div></div>';bindWeekDrag()}
function bindTimelineDrag(start,span){if(!canEdit)return;document.querySelectorAll('.tl-bar[data-id]').forEach(bar=>{let active=false,originX=0,originLeft=0;bar.onpointerdown=e=>{active=true;originX=e.clientX;originLeft=parseFloat(bar.style.left)||0;bar.setPointerCapture(e.pointerId);bar.classList.add('dragging')};bar.onpointermove=e=>{if(!active)return;const track=bar.parentElement,delta=(e.clientX-originX)/track.clientWidth*100;bar.style.left=Math.max(0,Math.min(100-parseFloat(bar.style.width),originLeft+delta))+'%'};bar.onpointerup=async()=>{if(!active)return;active=false;bar.classList.remove('dragging');const left=parseFloat(bar.style.left),t=tickets.find(x=>String(x.id)===String(bar.dataset.id));if(!t)return;try{await saveSchedule(t,{scheduled_start_time:hhmm(start+(left/100)*span)},'timeline')}catch(e){alert(e.message);await loadTimelineDay()}}})}
function bindWeekDrag(){if(!canEdit)return;document.querySelectorAll('.week-chip[data-id]').forEach(chip=>{let hold=null,drag=false;chip.onpointerdown=e=>{hold=setTimeout(()=>{drag=true;chip.setPointerCapture(e.pointerId);chip.style.opacity='.55'},250)};chip.onpointerup=async e=>{clearTimeout(hold);if(!drag)return;drag=false;chip.style.opacity='';const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-week-date]'),t=tickets.find(x=>String(x.id)===String(chip.dataset.id));if(target&&t){try{await saveSchedule(t,{scheduled_date:target.dataset.weekDate},'timeline')}catch(err){alert(err.message);await load()}}};chip.onpointercancel=()=>{clearTimeout(hold);drag=false;chip.style.opacity=''}})}
async function saveSchedule(t,patch,source){await api('/api/technician-kanban/'+encodeURIComponent(t.id)+'/schedule',{method:'PATCH',body:JSON.stringify({scheduled_date:patch.scheduled_date??t.scheduled_date,scheduled_start_time:patch.scheduled_start_time??t.scheduled_start_time,estimated_duration_minutes:patch.estimated_duration_minutes??t.estimated_duration_minutes??60,schedule_priority:t.schedule_priority||'normal',schedule_order:t.schedule_order||0,technicians:t.technicians||[],source:source||'kanban'})});await load()}
function mv(n){week=add(week,n);load()}function today(){week=mon(new Date());timelineDate.value=ymd(new Date());load()}
function openM(id){editing=tickets.find(x=>String(x.id)===String(id));if(!editing)return;date.value=editing.scheduled_date||ymd(new Date());time.value=editing.scheduled_start_time||'08:00';dur.value=editing.estimated_duration_minutes||60;err.textContent='';modal.classList.add('show')}
function closeM(){modal.classList.remove('show');editing=null}
async function saveM(){if(!editing)return;try{await saveSchedule(editing,{scheduled_date:date.value,scheduled_start_time:time.value,estimated_duration_minutes:Number(dur.value)},'kanban');closeM()}catch(e){err.textContent=e.message}}
timelineDate.value=ymd(new Date());load();
</script></body></html>
