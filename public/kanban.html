<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelApps · Kanban Teknisi</title><style>body{font-family:Arial,sans-serif;background:#f7f6f3;color:#1a1916;margin:0}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:14px 16px;display:flex;gap:10px;align-items:center;z-index:2}.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 14px;font-size:14px}.wrap{padding:16px}.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.head h2{margin-right:auto}.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px}.day{min-width:290px;max-width:330px;background:#f3f2ef;border:1px solid #ddd8cf;border-radius:10px;padding:10px}.card{background:#fff;border:1px solid #dedad2;border-radius:8px;padding:9px;margin-bottom:7px}.meta{font-size:12px;color:#6f6b64;margin-top:3px}.free{font-size:12px;color:#3b6d11;margin:6px 0 8px}.warn{color:#a32d2d}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}.modal.show{display:flex}.dialog{width:min(420px,100%);background:#fff;border-radius:14px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ddd;border-radius:8px}@media(max-width:600px){.day{min-width:86vw}.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><button class="btn" onclick="backToApp()">← Kembali</button><b>🗓️ Kanban Teknisi</b></div><div class="wrap"><div class="head"><h2>Kanban & Jadwal Teknisi</h2><button class="btn" onclick="mv(-7)">‹ Minggu</button><button class="btn" onclick="today()">Hari Ini</button><button class="btn" onclick="mv(7)">Minggu ›</button></div><div id="range" class="meta" style="margin-bottom:10px"></div><div id="body">Memuat...</div></div><div id="modal" class="modal"><div class="dialog"><h3>Edit Jadwal WO</h3><div class="grid"><div class="field"><label>Tanggal kerja</label><input type="date" id="date"></div><div class="field"><label>Jam mulai</label><input type="time" id="time"></div></div><div class="field"><label>Estimasi durasi (menit)</label><input type="number" id="dur" min="1" max="1440"></div><div id="err" class="warn"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" onclick="closeM()">Batal</button><button class="btn" onclick="saveM()">Simpan</button></div></div></div><script>function backToApp(){try{if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin){history.back();return}}catch(_){}location.replace('/')}const T=()=>localStorage.getItem('pixel_token')||sessionStorage.getItem('pixel_token')||localStorage.getItem('token')||localStorage.getItem('authToken')||localStorage.getItem('pxl_token')||'';const H=()=>{const t=T(),h={'Content-Type':'application/json'};if(t){h.Authorization='Bearer '+t;h['X-Auth-Token']=t}return h};const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),mon=d=>{const x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);x.setHours(0,0,0,0);return x},add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));let week=mon(new Date()),tickets=[],techs=[],canEdit=false,editing=null;async function api(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt,headers:{...H(),...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.message||('HTTP '+r.status));return d}function endTime(t){if(!t.scheduled_start_time)return'-';const [h,m]=t.scheduled_start_time.split(':').map(Number),v=h*60+m+Number(t.estimated_duration_minutes||60);return pad(Math.floor(v/60)%24)+':'+pad(v%60)}async function load(){const end=add(week,6);document.getElementById('range').textContent=week.toLocaleDateString('id-ID')+' – '+end.toLocaleDateString('id-ID');const b=document.getElementById('body');b.textContent='Memuat...';try{const d=await api('/api/technician-kanban?date_from='+ymd(week)+'&date_to='+ymd(end));tickets=d.tickets||[];techs=d.technicians||[];canEdit=!!d.can_edit;render()}catch(e){b.innerHTML='<div class="warn">'+esc(e.message)+'</div>'}}function render(){const days=[...Array(7)].map((_,i)=>add(week,i));document.getElementById('body').innerHTML='<div class="board">'+days.map(d=>{const date=ymd(d),rows=tickets.filter(t=>t.scheduled_date===date),used=new Set();rows.forEach(t=>(t.technicians||[]).forEach(x=>used.add(String(typeof x==='object'?(x.id||x.name):x))));const free=techs.filter(x=>!used.has(String(x.id))&&!used.has(String(x.name)));return '<div class="day"><h3>'+d.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'short'})+'</h3><div class="meta">'+rows.length+' WO · Terisi '+used.size+'/'+techs.length+' · Sisa '+free.length+'</div><div class="free">'+(free.length?'Kosong: '+free.map(x=>esc(x.name)).join(', '):'Tidak ada teknisi kosong')+'</div>'+rows.sort((a,b)=>String(a.scheduled_start_time||'').localeCompare(String(b.scheduled_start_time||''))).map(t=>'<div class="card"><b>'+esc(t.wo_number||'-')+'</b><div>'+esc(t.project_name||t.customer_name||'-')+'</div><div class="meta">'+esc(t.customer_name||'-')+' · '+esc((t.technicians||[]).map(x=>typeof x==='object'?(x.name||x.username||x.id):x).join(', ')||'Belum ada teknisi')+'</div><div class="meta">🕒 '+esc(t.scheduled_start_time||'-')+'–'+esc(endTime(t))+' · '+esc(t.estimated_duration_minutes||60)+' menit</div><div class="meta">Status: '+esc(t.status||'-')+'</div>'+(canEdit?'<button class="btn" style="margin-top:7px" onclick="openM(\''+esc(t.id)+'\')">Edit Jadwal</button>':'')+'</div>').join('')+(rows.length?'':'<div class="meta">Belum ada WO.</div>')+'</div>'}).join('')+'</div>'}function mv(n){week=add(week,n);load()}function today(){week=mon(new Date());load()}function openM(id){editing=tickets.find(x=>String(x.id)===String(id));if(!editing)return;date.value=editing.scheduled_date||ymd(new Date());time.value=editing.scheduled_start_time||'08:00';dur.value=editing.estimated_duration_minutes||60;err.textContent='';modal.classList.add('show')}function closeM(){modal.classList.remove('show');editing=null}async function saveM(){if(!editing)return;try{await api('/api/technician-kanban/'+encodeURIComponent(editing.id)+'/schedule',{method:'PATCH',body:JSON.stringify({scheduled_date:date.value,scheduled_start_time:time.value,estimated_duration_minutes:Number(dur.value),schedule_priority:editing.schedule_priority||'normal',schedule_order:editing.schedule_order||0,technicians:editing.technicians||[],source:'kanban'})});closeM();load()}catch(e){err.textContent=e.message}}load();</script></body></html>
