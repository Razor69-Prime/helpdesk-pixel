<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelApps · AI Report</title><style>body{font-family:Arial,sans-serif;background:#f7f6f3;color:#1a1916;margin:0}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:14px 16px;display:flex;gap:10px;align-items:center;z-index:2}.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 14px;font-size:14px}.wrap{padding:16px;max-width:1000px;margin:auto}.card{background:#fff;border:1px solid #e2ded6;border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.metric{background:#faf9f7;border:1px solid #ece8e1;border-radius:10px;padding:12px}.metric b{font-size:20px;display:block;margin-top:4px}.muted{color:#7a7670;font-size:12px}.ok{color:#2e7d32}.warn{color:#b26a00}.ai-text{white-space:pre-wrap;line-height:1.55;margin-top:16px;padding-top:14px;border-top:1px solid #ece8e1}</style></head><body><div class="top"><button class="btn" onclick="backToApp()">← Kembali</button><b>🤖 AI Report</b><span class="muted">READ ONLY</span></div><div class="wrap"><div class="card"><div class="grid"><button class="btn" onclick="run('daily')">Daily Report</button><button class="btn" onclick="run('weekly')">Weekly Report</button><button class="btn" onclick="run('next')">Next Week Plan</button><button class="btn" onclick="run('monthly')">Monthly Report</button></div></div><div id="result" class="card">Pilih report.</div><div class="card"><div><b>Status</b></div><p>Mode: <b>READ ONLY</b></p><p>Data Engine: Ticket/WO + Project + CRM + Kunjungan + SO + Invoice + MR + PR</p><p>Gemini AI: <span id="gemini">Memeriksa...</span></p><p>Revision: PXL-URG-0008 / PXL-AI-0005B</p></div></div><script>function backToApp(){try{if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin){history.back();return}}catch(_){}location.replace('/')}const T=()=>localStorage.getItem('pixel_token')||sessionStorage.getItem('pixel_token')||'';const H=()=>{const t=T(),h={Accept:'application/json'};if(t){h.Authorization='Bearer '+t;h['X-Auth-Token']=t}return h};async function G(u){const r=await fetch(u,{headers:H(),cache:'no-store'});if(!r.ok)throw new Error(u+' HTTP '+r.status);const d=await r.json();return Array.isArray(d)?d:(d.rows||[])};const D=v=>{if(!v)return null;const d=new Date(v);if(isNaN(d))return null;return d.toISOString().slice(0,10)},M=d=>{const x=new Date(d);x.setHours(0,0,0,0);const n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x},A=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},R=(k,a,b)=>k&&k>=D(a)&&k<=D(b),money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0)),pend=s=>!['done','completed','selesai','approved','received','closed','cancelled','canceled','void'].includes(String(s||'').toLowerCase());function box(l,v){return '<div class="metric"><span class="muted">'+l+'</span><b>'+v+'</b></div>'}async function aiDaily(summary){const r=await fetch('/api/ai/reports/daily',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({summary})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}async function run(type){const e=document.getElementById('result');e.textContent='Membaca data...';try{const [t,p,c,v,so,inv,mr,pr]=await Promise.all([G('/api/tickets'),G('/api/project-reports').catch(()=>[]),G('/api/crm/customers').catch(()=>[]),G('/api/sales-visits'),G('/api/sales-orders').catch(()=>[]),G('/api/crm/invoices').catch(()=>[]),G('/api/material-requests').catch(()=>[]),G('/api/purchase-requests').catch(()=>[])]);const now=new Date();let a,b,key=x=>D(x.worked_at||x.scheduled_date||x.created_at);if(type==='daily'){a=b=new Date(now.getFullYear(),now.getMonth(),now.getDate())}else if(type==='weekly'){a=M(now);b=A(a,6)}else if(type==='next'){a=A(M(now),7);b=A(a,6);key=x=>D(x.scheduled_date||x.worked_at)}else{a=new Date(now.getFullYear(),now.getMonth(),1);b=new Date(now.getFullYear(),now.getMonth()+1,0)}const tx=t.filter(x=>R(key(x),a,b)),sx=so.filter(x=>R(D(x.so_date||x.order_date||x.created_at),a,b)),ix=inv.filter(x=>R(D(x.invoice_date||x.created_at),a,b)),mx=mr.filter(x=>R(D(x.request_date||x.created_at),a,b)),px=pr.filter(x=>R(D(x.request_date||x.created_at),a,b)),vx=v.filter(x=>R(D(x.visit_date||x.created_at),a,b));const soValue=sx.reduce((n,x)=>n+Number(x.total_amount||x.grand_total||x.total||0),0),outstanding=ix.reduce((n,x)=>n+Number(x.balance_due??x.outstanding_amount??0),0),woDone=tx.filter(x=>!pend(x.status)).length; e.innerHTML='<b>'+a.toLocaleDateString('id-ID')+' – '+b.toLocaleDateString('id-ID')+'</b><div class="grid" style="margin-top:12px">'+box('WO',tx.length)+box('Project',p.length)+box('CRM',c.length)+box('Kunjungan',vx.length)+box('Sales Order',sx.length)+box('Nilai SO',money(soValue))+box('Invoice',ix.length)+box('Outstanding',money(outstanding))+box('MR',mx.length)+box('MR Pending',mx.filter(x=>pend(x.status)).length)+box('PR',px.length)+box('PR Pending',px.filter(x=>pend(x.status)).length)+'</div>';if(type==='daily'){const ai=document.createElement('div');ai.className='ai-text';ai.textContent='Gemini sedang menyusun Daily Management Report...';e.appendChild(ai);try{const d=await aiDaily({date:D(a),wo_total:tx.length,wo_done:woDone,wo_pending:Math.max(0,tx.length-woDone),project_total:p.length,crm_total:c.length,visits_total:vx.length,sales_order_total:sx.length,sales_order_value:soValue,invoice_total:ix.length,invoice_outstanding:outstanding,material_request_total:mx.length,material_request_pending:mx.filter(x=>pend(x.status)).length,purchase_request_total:px.length,purchase_request_pending:px.filter(x=>pend(x.status)).length});ai.textContent=d.report||'Gemini tidak menghasilkan report.'}catch(err){ai.innerHTML='<b class="warn">Gemini Daily Report gagal</b><div>'+String(err.message||err)+'</div>'}}}catch(err){e.innerHTML='<b class="warn">Gagal membaca data</b><div>'+String(err.message||err)+'</div>'}}(async()=>{const e=document.getElementById('gemini');try{const r=await fetch('/api/ai/gemini/health',{headers:H(),cache:'no-store'}),d=await r.json().catch(()=>({}));if(r.ok&&d.connected){e.textContent='Connected — '+(d.model||'Gemini');e.className='ok'}else{e.textContent='Not Connected — '+(d.error||('HTTP '+r.status));e.className='warn'}}catch(x){e.textContent='Not Connected';e.className='warn'}})();</script></body></html>
